plugins { id 'com.android.application' }

// v1.15: auth stabilization; deterministic Google OAuth identity and recovery UX support.
// RC hardening keeps release-signing preparation and the authoritative native product boundary.
// No WebView UI, no generated HTML, no composer/patch pipeline.
android {
    namespace 'com.vardath.janus'
    compileSdk 36

    def releaseStoreFile = project.findProperty('JANUS_RELEASE_STORE_FILE') ?: System.getenv('JANUS_RELEASE_STORE_FILE')
    def releaseStorePassword = project.findProperty('JANUS_RELEASE_STORE_PASSWORD') ?: System.getenv('JANUS_RELEASE_STORE_PASSWORD')
    def releaseKeyAlias = project.findProperty('JANUS_RELEASE_KEY_ALIAS') ?: System.getenv('JANUS_RELEASE_KEY_ALIAS')
    def releaseKeyPassword = project.findProperty('JANUS_RELEASE_KEY_PASSWORD') ?: System.getenv('JANUS_RELEASE_KEY_PASSWORD')

    signingConfigs {
        debug {
            storeFile file(System.getProperty('user.home') + '/.android/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId 'com.vardath.janus'
        minSdk 26
        targetSdk 36
        versionCode 115
        versionName '1.15'
        // OAuth client IDs are public identifiers, not secrets. Keep the tester
        // Android build deterministic so an empty CI secret can never compile a
        // different identity and produce Google DEVELOPER_ERROR/code 10.
        def googleWebClientId = '236215282074-7s6uj0tdeen1r3ptcpd2nlmkam97j0l3.apps.googleusercontent.com'
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', '"' + googleWebClientId + '"'
    }

    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release {
            minifyEnabled false
            shrinkResources false
            if (signingConfigs.findByName('release') != null) signingConfig signingConfigs.release
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
}
