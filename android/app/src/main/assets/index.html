<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><style>
:root{font-family:Arial,sans-serif;color:#171717;background:#fff;--top-safe:max(env(safe-area-inset-top),18px);--bottom-safe:max(env(safe-area-inset-bottom),18px);--nav-h:64px}*{box-sizing:border-box}html,body{min-height:100%;background:#fff}body{margin:0;padding-top:var(--top-safe);padding-bottom:calc(var(--nav-h) + var(--bottom-safe))}.top{padding:14px 16px 12px;border-bottom:1px solid #ddd;font-weight:700;background:#fff;position:sticky;top:0;z-index:9}.view{display:none;padding:16px 14px calc(var(--nav-h) + var(--bottom-safe) + 28px)}.view.active{display:block}.nav{position:fixed;bottom:var(--bottom-safe);left:8px;right:8px;min-height:var(--nav-h);display:flex;align-items:stretch;background:#fff;border:1px solid #d3d3d3;border-radius:14px;overflow:hidden;z-index:20;box-shadow:0 2px 10px rgba(0,0,0,.10)}.nav button{flex:1;min-width:0;padding:10px 2px 9px;border:0;background:#fff;font-size:10.5px;line-height:1.1}.nav button.on{font-weight:700;background:#f4f4f4;box-shadow:inset 0 3px 0 #222}.row{display:flex;gap:8px}.grow{flex:1}button,input,textarea{font:inherit}.sendbar{position:fixed;bottom:calc(var(--bottom-safe) + var(--nav-h) + 10px);left:8px;right:8px;display:flex;gap:8px;padding:8px;background:#fff;border:1px solid #ddd;border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.08);z-index:19}.sendbar textarea{flex:1;min-height:48px;max-height:120px;padding:10px;border:1px solid #ccc;border-radius:10px;resize:none}.sendbar button{width:72px;border:0;border-radius:10px;background:#222;color:#fff;font-weight:700}.chat{padding-bottom:calc(var(--nav-h) + var(--bottom-safe) + 112px)}.msg{max-width:82%;margin:9px 0;padding:10px 12px;border-radius:14px;white-space:pre-wrap;box-shadow:0 1px 2px rgba(0,0,0,.06)}.janus{margin-right:auto;background:#eee}.user{margin-left:auto;background:#dcecff;text-align:left}.system{margin:9px auto;background:#f8f8f8;color:#666}.card{border:1px solid #ddd;border-radius:12px;padding:12px;margin:8px 0;background:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.small{font-size:12px;color:#666}.tabs{display:flex;gap:6px;margin:8px 0}.tabs button{padding:8px 12px;border:1px solid #ccc;border-radius:9px;background:#fff}.tabs .on{font-weight:bold;background:#f2f2f2}.item{border-bottom:1px solid #ddd;padding:10px 2px}.item b{display:block}.detail{white-space:pre-wrap}.toggle{display:flex;justify-content:space-between;align-items:center;padding:10px 0}.range{width:100%}h2{margin-top:4px;margin-bottom:12px}h3{margin-bottom:8px}pre{white-space:pre-wrap}.status{font-size:12px;color:#555}@media (max-width:380px){.nav button{font-size:9.5px}.grid{grid-template-columns:1fr}.top{font-size:15px}}
</style></head><body><div class="top">JANUS · Global 7→3→1 <span id="status" class="status">connecting…</span></div>
<div id="chat" class="view active"><h2>Conversation</h2><div id="chatlog" class="chat"></div><div class="sendbar"><textarea id="composer" placeholder="Message JANUS"></textarea><button onclick="sendChat()">Send</button></div></div>
<div id="observe" class="view"><h2>Observe</h2><div id="observeList"></div></div>
<div id="cores" class="view"><h2>Cores</h2><div class="tabs"><button id="serverTab" class="on" onclick="showCoreTab('server')">Server</button><button id="clientTab" onclick="showCoreTab('client')">Client</button></div><div id="coreServer"></div><div id="coreClient" style="display:none"></div></div>
<div id="memory" class="view"><h2>Memory</h2><div id="memoryList"></div></div>
<div id="activity" class="view"><h2>Activity</h2><div id="activityList"></div></div>
<div id="settings" class="view"><h2>Settings</h2><div class="card"><div class="toggle"><span>Auto refresh</span><input id="autoRefresh" type="checkbox" checked onchange="saveSettings()"></div><label>Refresh interval: <b id="refreshLabel">10s</b></label><input id="refreshSeconds" class="range" type="range" min="5" max="60" step="5" value="10" oninput="refreshLabel.textContent=this.value+'s'" onchange="saveSettings()"></div><div class="card"><div class="toggle"><span>Include chat in Activity</span><input id="showChat" type="checkbox" checked onchange="saveSettings()"></div><div id="serverSettings"></div></div></div>
<div class="nav" id="nav"></div>
<script>
const profile=Android.profileId(), server=Android.serverUrl(); let seq=0,pending={},timer=null; const pages=['chat','observe','cores','memory','activity','settings'];
window.__janusResult=(id,res)=>{let p=pending[id];if(!p)return;delete pending[id];if(res.ok){try{p.resolve(JSON.parse(res.body))}catch(e){p.resolve(res.body)}}else p.reject(new Error('HTTP '+res.status+': '+res.body))};
function api(method,path,obj){return new Promise((resolve,reject)=>{let id='r'+(++seq);pending[id]={resolve,reject};Android.request(id,method,path,obj?JSON.stringify(obj):'{}')})}
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function fmt(t){return String(t||'').replace('T',' ').slice(0,19)}
function nav(){let n=document.getElementById('nav');n.innerHTML=pages.map(p=>`<button id="n-${p}" onclick="show('${p}')">${p[0].toUpperCase()+p.slice(1)}</button>`).join('');document.getElementById('n-chat').classList.add('on')}nav();
function show(p){pages.forEach(x=>{document.getElementById(x).classList.toggle('active',x===p);document.getElementById('n-'+x).classList.toggle('on',x===p)}); if(p!=='chat') refresh(p)}
function addMsg(who,text){let d=document.createElement('div');d.className='msg '+(who==='You'?'user':who==='JANUS'?'janus':'system');d.innerHTML='<b>'+esc(who)+'</b><br>'+esc(text);document.getElementById('chatlog').appendChild(d);d.scrollIntoView({behavior:'smooth',block:'end'})}
addMsg('JANUS','Connected. Ready.');
async function sendChat(){let c=document.getElementById('composer'),m=c.value.trim();if(!m)return;c.value='';addMsg('You',m);document.getElementById('status').textContent=' · thinking…';try{let r=await api('POST','/desktop/chat',{profile_id:profile,message:m});addMsg('JANUS',r.reply||r.response||JSON.stringify(r));document.getElementById('status').textContent=' · online'}catch(e){addMsg('System',e.message);document.getElementById('status').textContent=' · error'}}
document.getElementById('composer').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}});
async function refresh(p){try{if(p==='observe'){let r=await api('GET','/desktop/observe?username='+encodeURIComponent(profile));let rows=r.notes||r.items||[];document.getElementById('observeList').innerHTML=`<div class="small">Background cycle: ${r.background_cycle?.interval_minutes||'?'} min · ${rows.length} notes</div>`+rows.map(x=>`<div class="card"><b>${esc((x.event_type||x.type||'note').replaceAll('_',' '))}</b><div class="small">${fmt(x.created_at)}</div><div class="detail">${esc(x.detail||x.content||'')}</div></div>`).join('')||'<p>No notes yet.</p>'}
if(p==='memory'){let r=await api('GET','/desktop/memory?username='+encodeURIComponent(profile));let rows=r.items||[];document.getElementById('memoryList').innerHTML=rows.map(x=>`<div class="item"><b>${esc(x.level||'trace')} · ${esc(x.role||'memory')}</b><span class="small">${fmt(x.created_at)}</span><div class="detail">${esc(x.content||'')}</div></div>`).join('')||'<p>No memory records yet.</p>'}
if(p==='activity'){let r=await api('GET','/desktop/activity?username='+encodeURIComponent(profile));let rows=r.items||[];if(!document.getElementById('showChat').checked)rows=rows.filter(x=>!['chat_input','chat_output'].includes(x.event_type));document.getElementById('activityList').innerHTML=rows.map(x=>`<div class="item"><b>${esc((x.event_type||'event').replaceAll('_',' '))}</b><span class="small">${fmt(x.created_at)}</span><div class="detail">${esc(x.detail||'')}</div></div>`).join('')||'<p>No activity yet.</p>'}
if(p==='cores'){let r=await api('GET','/desktop/cores?username='+encodeURIComponent(profile));let roles=r.seven_roles||{},bridges=r.three_bridges||{};document.getElementById('coreServer').innerHTML=`<div class="card"><b>Origin</b><div>${esc(r.origin||'')}</div></div><h3>7 specialist lenses</h3><div class="grid">${Object.entries(roles).map(([k,v])=>`<div class="card"><b>${esc(k)}</b><div class="small">${esc(v)}</div></div>`).join('')}</div><h3>3 synthesis bridges</h3>${Object.entries(bridges).map(([k,v])=>`<div class="card"><b>${esc(k)}</b><div>${esc(v)}</div></div>`).join('')}<div class="card"><b>1 integrator</b><div>${esc(r.one_integrator?.name||'JANUS integrated response')}</div><div class="small">${esc(r.one_integrator?.description||'')}</div></div>`;document.getElementById('coreClient').innerHTML=`<div class="card"><b>Android client</b><div>Version 0.18</div><div>Profile: ${esc(profile)}</div><div>Server: ${esc(server)}</div><div>Auto refresh: ${document.getElementById('autoRefresh').checked?'On':'Off'}</div></div>`}
if(p==='settings'){let r=await api('GET','/desktop/settings?username='+encodeURIComponent(profile));let s=r.server||{};document.getElementById('serverSettings').innerHTML=`<b>Server background core</b><div class="small">Model: ${esc(s.model||'?')}<br>Background interval: ${esc(s.interval_minutes||'?')} min<br>Memory processing: ${s.memory_processing?'On':'Off'}<br>Self evaluation: ${s.self_evaluation?'On':'Off'}<br>External access: ${s.external_access?'On':'Off'}</div>`}}
catch(e){document.getElementById('status').textContent=' · '+e.message}}
function showCoreTab(t){document.getElementById('coreServer').style.display=t==='server'?'block':'none';document.getElementById('coreClient').style.display=t==='client'?'block':'none';document.getElementById('serverTab').classList.toggle('on',t==='server');document.getElementById('clientTab').classList.toggle('on',t==='client')}
function saveSettings(){localStorage.autoRefresh=document.getElementById('autoRefresh').checked;localStorage.refreshSeconds=document.getElementById('refreshSeconds').value;localStorage.showChat=document.getElementById('showChat').checked;schedule()}
function loadSettings(){if(localStorage.autoRefresh!=null)document.getElementById('autoRefresh').checked=localStorage.autoRefresh==='true';if(localStorage.refreshSeconds){document.getElementById('refreshSeconds').value=localStorage.refreshSeconds;refreshLabel.textContent=localStorage.refreshSeconds+'s'}if(localStorage.showChat!=null)document.getElementById('showChat').checked=localStorage.showChat==='true';schedule()}
function schedule(){if(timer)clearInterval(timer);if(document.getElementById('autoRefresh').checked)timer=setInterval(()=>{let p=pages.find(x=>document.getElementById(x).classList.contains('active'));if(['observe','activity','memory'].includes(p))refresh(p)},Number(document.getElementById('refreshSeconds').value)*1000)}
loadSettings();api('GET','/health').then(()=>document.getElementById('status').textContent=' · online').catch(()=>document.getElementById('status').textContent=' · offline');
</script></body></html>
