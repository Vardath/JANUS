services:
  - type: web
    name: janus-global-core
    runtime: python
    plan: starter
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - server_v2/**
        - requirements.txt
        - render.yaml
      ignoredPaths:
        - docs/**
        - .github/**
        - android/**
        - ios/**
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server_v2.entrypoint:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: janus-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: OPENAI_API_KEY
        sync: false
      - key: JANUS_ACCESS_TOKEN
        generateValue: true
      - key: JANUS_MODEL
        value: gpt-5.6-sol
      - key: JANUS_MODEL_LUNA
        value: gpt-5.6-luna
      - key: JANUS_MODEL_TERRA
        value: gpt-5.6-terra
      - key: JANUS_MODEL_SOL
        value: gpt-5.6-sol
      - key: JANUS_TERRA_ESCALATION_THRESHOLD
        value: "0.42"
      - key: JANUS_SOL_ESCALATION_THRESHOLD
        value: "0.72"
      - key: JANUS_FOREGROUND_WEB
        value: "1"
      - key: JANUS_CORE_FOREGROUND_MODEL
        value: gpt-5.6-luna
      - key: JANUS_BACKGROUND_MODEL
        value: gpt-5.6-luna
      - key: JANUS_DB_PATH
        value: /data/janus.sqlite3
      - key: JANUS_FILE_ROOT
        value: /data/janus_files_v2
      - key: JANUS_CORE_CHECKPOINT_SECONDS
        value: "30"
      - key: JANUS_GOOGLE_CLIENT_ID
        value: 236215282074-7s6uj0tdeen1r3ptcpd2nlmkam97j0l3.apps.googleusercontent.com
      - key: JANUS_SMTP_HOST
        value: smtp.resend.com
      - key: JANUS_SMTP_PORT
        value: "587"
      - key: JANUS_SMTP_USER
        value: resend
      - key: JANUS_SMTP_PASSWORD
        sync: false
      - key: JANUS_SMTP_FROM
        value: "JANUS <onboarding@resend.dev>"
      - key: JANUS_EMAIL_MODE
        value: development
      - key: JANUS_SMTP_TLS
        value: "1"
      - key: JANUS_INTERVAL_MINUTES
        value: "15"
      - key: JANUS_DORMANCY_PERCENT
        value: "67"
      - key: JANUS_WAKE_SECONDS
        value: "300"
      - key: JANUS_SLEEP_SECONDS
        value: "600"
      - key: JANUS_V2_BACKGROUND_TICK_SECONDS
        value: "300"
      - key: JANUS_MEMORY_PROCESSING
        value: "1"
      - key: JANUS_EXTERNAL_ACCESS
        value: "1"
      - key: JANUS_MESSAGE_QUEUE
        value: "1"
      - key: JANUS_COMPUTE_BUDGET
        value: balanced
      - key: JANUS_FOREGROUND_DAILY_CALL_CAP
        value: "500"
      - key: JANUS_BACKGROUND_DAILY_CALL_CAP
        value: "12"
      - key: JANUS_BACKGROUND_DAILY_TOKEN_CAP
        value: "20000"

      # Continuing digital observation. Wake/review and curiosity-intent formation are
      # zero-model/API; only selected outside observations spend the governed allowance.
      - key: JANUS_CURIOSITY_WEB
        value: "1"
      - key: JANUS_CURIOSITY_DAILY_SEARCH_CAP
        value: "40"
      - key: JANUS_CURIOSITY_RELEVANT_DAILY_CAP
        value: "2"
      - key: JANUS_CURIOSITY_ADJACENT_DAILY_CAP
        value: "1"
      - key: JANUS_CURIOSITY_WANDER_DAILY_CAP
        value: "1"
      - key: JANUS_CURIOSITY_MIN_GAP_SECONDS
        value: "1200"
      - key: JANUS_RESEARCH_MONTHLY_MAX_USD
        value: "20"
      - key: JANUS_AUTONOMOUS_RESEARCH_TARGET_USD
        value: "10"
      - key: JANUS_RESEARCH_ESTIMATED_USD_PER_CALL
        value: "0.01"

      # Private Supervisor maintenance inbox. Render SQLite + JSONL remain canonical.
      # Supply a fine-grained GitHub token with Issues read/write ONLY on
      # Vardath/JANUS-privatebuild; do not grant Contents/source-code write permission.
      - key: JANUS_MAINTENANCE_GITHUB_MIRROR
        value: "1"
      - key: JANUS_MAINTENANCE_GITHUB_REPO
        value: Vardath/JANUS-privatebuild
      - key: JANUS_MAINTENANCE_GITHUB_ISSUE
        value: "1"
      - key: JANUS_MAINTENANCE_GITHUB_TOKEN
        sync: false

      - key: JANUS_IMAGE_MODEL
        value: gpt-image-1
      - key: JANUS_IMAGE_QUALITY
        value: medium
      - key: JANUS_IMAGE_DAILY_CAP
        value: "20"
      - key: JANUS_AUTO_EXPLANATORY_IMAGES
        value: "1"
      - key: JANUS_AUTO_IMAGE_DAILY_CAP
        value: "2"
      - key: JANUS_ALLOW_LEGACY_BRIDGE_AUTH
        value: "0"
      - key: JANUS_AUTH_DEV_TOKENS
        value: "0"
