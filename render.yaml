services:
  - type: web
    name: janus-global-core
    runtime: python
    plan: starter
    region: singapore
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bootstrap:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: janus-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: OPENAI_API_KEY
        sync: false
      - key: JANUS_ACCESS_TOKEN
        generateValue: true
      - key: JANUS_MODEL
        value: gpt-5.6
      - key: JANUS_DB_PATH
        value: /data/janus.sqlite3
      - key: JANUS_CORE_CHECKPOINT_SECONDS
        value: "30"
      - key: JANUS_GOOGLE_CLIENT_ID
        value: 236215282074-7s6uj0tdeen1r3ptcpd2nlmkam97j0l3.apps.googleusercontent.com
      - key: JANUS_SMTP_HOST
        value: smtp.resend.com
      - key: JANUS_SMTP_PORT
        value: "587"
      - key: JANUS_SMTP_USER
        value: resend
      - key: JANUS_SMTP_PASSWORD
        sync: false
      - key: JANUS_SMTP_FROM
        value: "JANUS <onboarding@resend.dev>"
      - key: JANUS_EMAIL_MODE
        value: development
      - key: JANUS_SMTP_TLS
        value: "1"
      - key: JANUS_AUTH_TOKEN_CLEANUP_DAYS
        value: "7"
      - key: JANUS_CHAT_RECEIPT_RETENTION_DAYS
        value: "7"
      - key: JANUS_RUNTIME_SNAPSHOT_RETENTION_DAYS
        value: "30"
      - key: JANUS_DELETION_REQUEST_RETENTION_DAYS
        value: "90"
      - key: JANUS_INTERVAL_MINUTES
        value: "15"
      - key: JANUS_DORMANCY_PERCENT
        value: "67"
      - key: JANUS_WAKE_SECONDS
        value: "300"
      - key: JANUS_SLEEP_SECONDS
        value: "600"
      - key: JANUS_THOUGHT_COUNT
        value: "1"
      - key: JANUS_MEMORY_PROCESSING
        value: "1"
      - key: JANUS_SELF_EVALUATION
        value: "0"
      - key: JANUS_EXTERNAL_ACCESS
        value: "1"
      - key: JANUS_SUPERVISOR_CONSULTATION
        value: "0"
      - key: JANUS_MESSAGE_QUEUE
        value: "1"
      - key: JANUS_THOUGHT_HISTORY
        value: "1"
      - key: JANUS_COMPUTE_BUDGET
        value: balanced
      - key: JANUS_PAID_BACKGROUND_REFLECTION
        value: "0"
      - key: JANUS_BACKGROUND_DAILY_CALL_CAP
        value: "12"
      - key: JANUS_BACKGROUND_DAILY_TOKEN_CAP
        value: "20000"
      - key: JANUS_ALLOW_LEGACY_BRIDGE_AUTH
        value: "0"
      - key: JANUS_AUTH_DEV_TOKENS
        value: "0"
