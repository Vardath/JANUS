name: JANUS
options:
  bundleIdPrefix: com.vardath
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: ""
targets:
  JANUS:
    type: application
    platform: iOS
    sources:
      - JANUS
    info:
      path: JANUS/Info.plist
      properties:
        CFBundleDisplayName: JANUS
        CFBundleShortVersionString: "0.3"
        CFBundleVersion: "3"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vardath.janus
