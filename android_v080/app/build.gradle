plugins { id 'com.android.application' }

android {
    namespace 'com.vardath.janus.v080'
    compileSdk 36

    defaultConfig {
        applicationId 'com.vardath.janus.v080'
        minSdk 26
        targetSdk 36
        versionCode 80
        versionName '0.80-dev1'
        def serverBaseUrl = project.findProperty('JANUS_SERVER_BASE_URL') ?: 'https://janus-global-core.onrender.com'
        buildConfigField 'String', 'SERVER_BASE_URL', '"' + serverBaseUrl + '"'
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// AndroidX dependencies currently arrive with a mixed Kotlin runtime graph
// (old kotlin-stdlib plus newer jdk7/jdk8 compatibility artifacts), which
// creates duplicate classes at checkDebugDuplicateClasses. v0.80 itself is
// Java-only, so keep one modern stdlib and discard the obsolete split jars.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' &&
                details.requested.name == 'kotlin-stdlib') {
            details.useVersion '1.8.22'
            details.because 'Use one Kotlin runtime version for AndroidX transitive dependencies'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
}
