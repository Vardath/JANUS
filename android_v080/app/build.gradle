plugins { id 'com.android.application' }

android {
    namespace 'com.vardath.janus.v080'
    compileSdk 36

    defaultConfig {
        applicationId 'com.vardath.janus.v080'
        minSdk 26
        targetSdk 36
        versionCode 81
        versionName '0.80-dev2'
        def serverBaseUrl = project.findProperty('JANUS_SERVER_BASE_URL') ?: 'https://janus-global-core.onrender.com'
        def googleWebClientId = project.findProperty('JANUS_GOOGLE_WEB_CLIENT_ID') ?: '236215282074-7s6uj0tdeen1r3ptcpd2nlmkam97j0l3.apps.googleusercontent.com'
        buildConfigField 'String', 'SERVER_BASE_URL', '"' + serverBaseUrl + '"'
        buildConfigField 'String', 'GOOGLE_WEB_CLIENT_ID', '"' + googleWebClientId + '"'
    }

    // The original JANUS HTML/CSS is the product UI specification. v0.80
    // consumes it directly instead of approximating it with a different native screen.
    sourceSets {
        main {
            assets.srcDirs += ['../../android/app/src/main/assets']
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin' && details.requested.name == 'kotlin-stdlib') {
            details.useVersion '1.8.22'
            details.because 'Use one Kotlin runtime version for AndroidX transitive dependencies'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
    implementation 'com.google.android.gms:play-services-auth:21.4.0'
}
