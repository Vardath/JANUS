name: Prove clean JANUS server v2

on:
  push:
    branches: [main]
    paths:
      - 'server_v2/**'
      - 'tools/verify_server_v2.py'
      - '.github/workflows/server-v2-proof.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile clean server only
        run: python -m py_compile server_v2/*.py tools/verify_server_v2.py
      - name: Prove no legacy application imports
        run: |
          ! grep -R "^from \(bootstrap\|janus_dashboard\|dashboard_api\|interface_chat\|secure_desktop\|attachment_chat\|image_response_compat\|src\.janus_sleep_cycle\)" server_v2
          ! grep -R "^import \(bootstrap\|janus_dashboard\|dashboard_api\|interface_chat\|secure_desktop\|attachment_chat\|image_response_compat\)" server_v2
      - name: Run end-to-end reconstruction verification
        run: python tools/verify_server_v2.py
      - name: Record proof on main
        env:
          VERIFIED_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs
          printf '# JANUS server v2 CI proof\n\nVerified commit: `%s`\n\nChecks passed: Python compile, no legacy application imports, clean authentication/data migration, protected identity, 11-core 7→2→1→1 routing, adaptive bridge authority, multi-account isolation, selective local/global sync, files, continuity, research, artifacts, Observe and restart persistence.\n' "$VERIFIED_SHA" > docs/SERVER_V2_CI_PASS.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/SERVER_V2_CI_PASS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record passing clean JANUS server v2 proof"
          git push
