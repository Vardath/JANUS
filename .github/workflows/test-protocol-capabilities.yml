name: Test JANUS Protocol Capabilities

on:
  push:
    branches: [main]
    paths:
      - 'protocol_capabilities.py'
      - 'tools/patch_protocol_capabilities.py'
      - 'tools/patch_android_protocol_capabilities.py'
      - 'tests/test_protocol_capabilities.py'
      - '.github/workflows/test-protocol-capabilities.yml'
      - '.github/workflows/build-android.yml'
      - 'Dockerfile'
  pull_request:
    paths:
      - 'protocol_capabilities.py'
      - 'tools/patch_protocol_capabilities.py'
      - 'tools/patch_android_protocol_capabilities.py'
      - 'tests/test_protocol_capabilities.py'
      - '.github/workflows/test-protocol-capabilities.yml'
      - '.github/workflows/build-android.yml'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  protocol-capabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install application and test dependencies
        run: pip install -r requirements.txt pytest
      - name: Verify protocol capability contract
        run: python -m pytest -q tests/test_protocol_capabilities.py
      - name: Verify bootstrap patch composes
        run: |
          python tools/patch_protocol_capabilities.py
          grep -q 'protocol_capabilities_router' bootstrap.py
          grep -q 'APIRouter(prefix="/protocol"' protocol_capabilities.py
          grep -q '@router.get("/capabilities")' protocol_capabilities.py
      - name: Verify Android product patch composes
        run: |
          python tools/patch_android_file_attachments.py
          python tools/patch_android_artifacts.py
          python tools/patch_android_research_workspace.py
          python tools/patch_android_maintenance_review.py
          python tools/patch_android_research_provenance.py
          python tools/patch_android_protocol_capabilities.py
          grep -q 'Compatibility' android/app/src/main/assets/index.html
          grep -q '/protocol/capabilities' android/app/src/main/assets/index.html
          grep -q 'applyCapabilityVisibility' android/app/src/main/assets/index.html
