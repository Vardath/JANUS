name: Test JANUS Android Research Provenance

on:
  push:
    branches: [main]
    paths:
      - 'research_provenance_api.py'
      - 'background_usefulness.py'
      - 'cost_governor.py'
      - 'curiosity_search.py'
      - 'tools/patch_research_provenance_api.py'
      - 'tools/patch_android_research_provenance.py'
      - 'tools/patch_android_maintenance_review.py'
      - 'tools/patch_android_research_workspace.py'
      - 'tools/patch_android_artifacts.py'
      - 'tools/patch_android_file_attachments.py'
      - 'tests/test_android_research_provenance.py'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/test-android-provenance.yml'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  provenance-productization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Verify provenance integration contract
        run: python -m pytest -q tests/test_android_research_provenance.py
      - name: Verify Android product patches compose
        run: |
          python tools/patch_android_file_attachments.py
          python tools/patch_android_artifacts.py
          python tools/patch_android_research_workspace.py
          python tools/patch_android_maintenance_review.py
          python tools/patch_android_research_provenance.py
          grep -q 'Background research' android/app/src/main/assets/index.html
          grep -q '/research-provenance/status' android/app/src/main/assets/index.html
          grep -q 'Maintenance review' android/app/src/main/assets/index.html
          grep -q 'pickAttachment()' android/app/src/main/assets/index.html
      - name: Verify bootstrap provenance API patch composes
        run: |
          python tools/patch_research_provenance_api.py
          grep -q 'research_provenance_router' bootstrap.py
          grep -q 'APIRouter(prefix="/research-provenance"' research_provenance_api.py
          grep -q '@router.get("/status")' research_provenance_api.py
