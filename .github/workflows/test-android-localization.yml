name: Test JANUS Android Localization

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/test-android-localization.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/test-android-localization.yml'

jobs:
  localization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate translation catalogue and explicit ownership contract
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          p = Path('android/app/src/main/java/com/vardath/janus/JanusUiTranslations.java')
          s = p.read_text(encoding='utf-8')
          key_block = re.search(r'commonKeys\(\) \{ return new String\[\]\{(.*?)\}; \}', s, re.S)
          assert key_block, 'common key catalogue not found'
          string_re = re.compile(r'"(?:\\.|[^"\\])*"')
          keys = string_re.findall(key_block.group(1))
          assert len(keys) >= 40, f'expected broad common UI coverage, found {len(keys)} keys'
          methods = re.findall(r'private static Map<String,String> ([A-Za-z0-9_]+)\(\)\{return map\((.*?)\);\}', s, re.S)
          assert len(methods) >= 23, f'expected at least 23 localized language/script tables, found {len(methods)}'
          bad = []
          for name, body in methods:
              values = string_re.findall(body)
              if len(values) != len(keys): bad.append((name, len(values), len(keys)))
          assert not bad, f'translation table length mismatch: {bad}'
          for code in ['es','fr','de','pt','it','nl','pl','tr','ru','uk','ar','fa','he','ur','hi','bn','id','vi','th','ja','ko','zh-Hans','zh-Hant']:
              assert f'all.put("{code}"' in s, f'missing language {code}'
          assert 'return english;' in s, 'English fallback must remain explicit'

          base = Path('android/app/src/main/java/com/vardath/janus')
          lang = (base / 'JanusLanguagePolish.java').read_text(encoding='utf-8')
          ui = (base / 'JanusUiLocalizationPolish.java').read_text(encoding='utf-8')
          main = (base / 'MainActivity.java').read_text(encoding='utf-8')
          app = (base / 'JanusApplication.java').read_text(encoding='utf-8')

          assert 'activity.recreate();' in lang
          assert 'renderSettingsCard' in lang
          assert 'JanusLanguagePolish.renderSettingsCard(this,list)' in main
          assert 'JanusUiLocalizationPolish.applyButton(this,b,s)' in main
          assert 'JanusUiLocalizationPolish.applyHint(this,e,hint)' in main
          assert 'controlText' in ui and 'applyButton' in ui and 'applyHint' in ui
          assert 'OnGlobalLayoutListener' not in ui
          assert 'getViewTreeObserver' not in ui
          assert 'OnGlobalLayoutListener' not in lang
          assert 'getViewTreeObserver' not in lang
          assert 'JanusUiLocalizationPolish.install' not in app
          assert 'JanusLanguagePolish.install' not in app
          print(f'Validated {len(methods)} translation tables x {len(keys)} common UI strings with explicit control ownership')
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'
      - name: Ensure stable debug signing key exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Compile and assemble localized APK
        working-directory: android
        run: gradle --no-daemon :app:compileDebugJavaWithJavac :app:assembleDebug --stacktrace
