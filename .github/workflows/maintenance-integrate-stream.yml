name: Maintenance integrate explicit Stream
on:
  push:
    branches: [android-v110-direct-stream-navigation]
    paths: ['.github/workflows/maintenance-integrate-stream.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: android-v110-direct-stream-navigation
      - name: Patch native navigation and remove this maintenance workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('android/app/src/main/java/com/vardath/janus/MainActivity.java')
          s = p.read_text(encoding='utf-8')

          old_nav = 'for (String page : new String[]{"Chat", "Messages", "Observe", "Options"})'
          new_nav = 'for (String page : new String[]{"Chat", "Messages", "Observe", "Stream", "Options"})'
          assert old_nav in s, 'top-level page list changed unexpectedly'
          s = s.replace(old_nav, new_nav, 1)

          old_page = 'if (page.equals("Messages")) showMessages(); else if (page.equals("Observe")) showObserve(); else if (page.equals("Options")) showOptions(); else showChat();'
          new_page = 'if (page.equals("Messages")) showMessages(); else if (page.equals("Observe")) showObserve(); else if (page.equals("Stream")) showStream(); else if (page.equals("Options")) showOptions(); else showChat();'
          assert old_page in s, 'showPage routing changed unexpectedly'
          s = s.replace(old_page, new_page, 1)

          anchor = '    private void scheduleMessageChecks() { PeriodicWorkRequest req = new PeriodicWorkRequest.Builder(JanusMessageWorker.class, 15, TimeUnit.MINUTES).build(); WorkManager.getInstance(this).enqueueUniquePeriodicWork("janus-message-check", ExistingPeriodicWorkPolicy.UPDATE, req); }\n'
          assert anchor in s, 'scheduleMessageChecks anchor missing'
          stream_method = '''\n    private void showStream() {\n        JanusStreamScreen.render(new JanusStreamScreen.Host() {\n            @Override public Activity activity() { return MainActivity.this; }\n            @Override public JanusApiClient api() { return api; }\n            @Override public void runIo(Runnable work) { io.execute(work); }\n            @Override public void runUi(Runnable work) { main.post(work); }\n            @Override public JSONObject localRecursiveSnapshot() { return JanusRecursiveCoreBridge.snapshot(); }\n        }, content);\n    }\n'''
          s = s.replace(anchor, anchor + stream_method, 1)

          s = s.replace('Options · v1.09 (109)', 'Options · v1.10 (110)', 1)
          p.write_text(s, encoding='utf-8')

          nav = Path('android/app/src/main/java/com/vardath/janus/JanusNavigationPolish.java')
          n = nav.read_text(encoding='utf-8')
          old_top = 'new String[]{"Chat", "Messages", "Observe", "Options"}'
          new_top = 'new String[]{"Chat", "Messages", "Observe", "Stream", "Options"}'
          assert old_top in n, 'Back-navigation page list changed unexpectedly'
          nav.write_text(n.replace(old_top, new_top, 1), encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/maintenance-integrate-stream.yml
          git add android/app/src/main/java/com/vardath/janus/MainActivity.java android/app/src/main/java/com/vardath/janus/JanusNavigationPolish.java
          git commit -m "Integrate explicit Stream into native navigation [skip ci]"
          git push origin HEAD:android-v110-direct-stream-navigation
