name: Test JANUS Files

on:
  pull_request:
    paths:
      - 'attachment_api.py'
      - 'attachment_retention.py'
      - 'attachment_chat.py'
      - 'vision_analysis.py'
      - 'account_deletion.py'
      - 'requirements.txt'
      - 'bootstrap.py'
      - 'tests/test_file_sharing.py'
      - 'tests/test_attachment_retention.py'
      - 'tests/test_attachment_chat.py'
      - 'tests/test_vision_analysis.py'
      - 'tests/test_pdf_extraction.py'
      - '.github/workflows/test-files.yml'
  push:
    branches: [main]
    paths:
      - 'attachment_api.py'
      - 'attachment_retention.py'
      - 'attachment_chat.py'
      - 'vision_analysis.py'
      - 'account_deletion.py'
      - 'requirements.txt'
      - 'bootstrap.py'
      - 'tests/test_file_sharing.py'
      - 'tests/test_attachment_retention.py'
      - 'tests/test_attachment_chat.py'
      - 'tests/test_vision_analysis.py'
      - 'tests/test_pdf_extraction.py'
      - '.github/workflows/test-files.yml'
  workflow_dispatch:

jobs:
  file-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run file-sharing, retention, PDF, vision and Chat-grounding tests
        run: python -m pytest -q tests/test_file_sharing.py tests/test_attachment_retention.py tests/test_attachment_chat.py tests/test_vision_analysis.py tests/test_pdf_extraction.py
