name: One-off v1.09 PR patch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/oneoff-v109-pr.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Patch v1.09
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/java/com/vardath/janus/MainActivity.java'); s=p.read_text()
          old='    private void showPage(String page) { content.removeAllViews(); for (int i = 0; i < nav.getChildCount(); i++) { Button b = (Button) nav.getChildAt(i); boolean selected = page.equals(b.getTag()); b.setTypeface(Typeface.DEFAULT, selected ? Typeface.BOLD : Typeface.NORMAL); b.setAlpha(selected ? 1f : .62f); } if (page.equals("Messages")) showMessages(); else if (page.equals("Observe")) showObserve(); else if (page.equals("Options")) showOptions(); else showChat(); }'
          new='    private void resetContentSurface() { LinearLayout previous = content; LinearLayout fresh = vertical(); fresh.setPadding(dp(12), dp(6), dp(12), dp(6)); LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, 0, 1); int index = previous == null ? 1 : root.indexOfChild(previous); if (previous != null && index >= 0) root.removeView(previous); content = fresh; root.addView(content, index >= 0 ? index : Math.min(1, root.getChildCount()), lp); }\n    private void showPage(String page) { resetContentSurface(); for (int i = 0; i < nav.getChildCount(); i++) { Button b = (Button) nav.getChildAt(i); boolean selected = page.equals(b.getTag()); b.setTypeface(Typeface.DEFAULT, selected ? Typeface.BOLD : Typeface.NORMAL); b.setAlpha(selected ? 1f : .62f); } if (page.equals("Messages")) showMessages(); else if (page.equals("Observe")) showObserve(); else if (page.equals("Options")) showOptions(); else showChat(); }'
          if s.count(old)!=1: raise SystemExit('showPage mismatch')
          s=s.replace(old,new)
          old='    private void detailHeader(String title) { content.removeAllViews(); Button back = button("← Options"); back.setOnClickListener(v -> showPage("Options")); content.addView(back, full()); content.addView(text(title, 28, true), full()); }'
          new='    private void detailHeader(String title) { resetContentSurface(); Button back = button("← Options"); back.setOnClickListener(v -> showPage("Options")); content.addView(back, full()); content.addView(text(title, 28, true), full()); }'
          if s.count(old)!=1: raise SystemExit('detailHeader mismatch')
          s=s.replace(old,new)
          old='    private void showOptions() { content.addView(text("Options", 28, true), full()); ScrollView scroll = new ScrollView(this);'
          new='    private void showOptions() { content.addView(text("Options · v1.09 (109)", 28, true), full()); ScrollView scroll = new ScrollView(this);'
          if s.count(old)!=1: raise SystemExit('showOptions mismatch')
          s=s.replace(old,new); p.write_text(s)
          g=Path('android/app/build.gradle'); t=g.read_text().replace('versionCode 108','versionCode 109').replace("versionName '1.08'","versionName '1.09'"); g.write_text(t)
          w=Path('.github/workflows/build-android.yml'); t=w.read_text().replace("versionName '1.08'","versionName '1.09'").replace('versionCode 108','versionCode 109').replace('UI: v1.08 governed self-diagnosis','UI: v1.09 fresh-content navigation hardening + governed self-diagnosis'); w.write_text(t)
          PY
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.11.1' }
      - name: Ensure debug signing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"; fi
      - name: Verify compile and APK
        working-directory: android
        env: { JANUS_GOOGLE_WEB_CLIENT_ID: '${{ secrets.JANUS_GOOGLE_WEB_CLIENT_ID }}' }
        run: |
          gradle --no-daemon :app:compileDebugJavaWithJavac -PJANUS_GOOGLE_WEB_CLIENT_ID="$JANUS_GOOGLE_WEB_CLIENT_ID"
          gradle --no-daemon :app:assembleDebug -PJANUS_GOOGLE_WEB_CLIENT_ID="$JANUS_GOOGLE_WEB_CLIENT_ID"
      - name: Push fix branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b fix/v109-navigation-rebuild
          git add android/app/src/main/java/com/vardath/janus/MainActivity.java android/app/build.gradle .github/workflows/build-android.yml
          git commit -m "Bump Android v1.09 and rebuild navigation surface"
          git push --force origin HEAD:fix/v109-navigation-rebuild