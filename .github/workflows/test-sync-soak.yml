name: Test JANUS Server Local Sync Soak

on:
  push:
    branches: [main]
    paths:
      - 'core_sync.py'
      - 'federated_sync.py'
      - 'tests/test_core_sync_presence.py'
      - 'tests/test_federated_sync.py'
      - 'tests/test_sync_soak.py'
      - '.github/workflows/test-sync-soak.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-soak:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
      JANUS_DB_PATH: /tmp/janus-sync-soak.sqlite3
      JANUS_AUTH_DB: /tmp/janus-sync-soak.sqlite3
      JANUS_FILE_DIR: /tmp/janus-sync-soak-files
      OPENAI_API_KEY: test-key-not-used
      JANUS_CLIENT_PRESENCE_TTL_SECONDS: '30'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install application and test dependencies
        run: pip install -r requirements.txt pytest
      - name: Reconstruct legacy base server
        run: python tools/rebuild_server.py
      - name: Compile synchronization modules
        run: python -m py_compile server.py core_sync.py federated_sync.py
      - name: Run selective sync regressions and soak
        run: python -m pytest -q tests/test_core_sync_presence.py tests/test_federated_sync.py tests/test_sync_soak.py
