name: Build JANUS Public v1.15 Tester APK

on:
  workflow_dispatch:
  push:
    branches: [public-v115-build]
    paths:
      - 'android/**'
      - '.github/workflows/build-public-v115-test.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Restore stable public tester signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: janus-android-debug-keystore-v1

      - name: Ensure stable public tester signing key exists
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Assert v1.15 package and Google Web OAuth identity
        shell: bash
        run: |
          set -euo pipefail
          grep -q "applicationId 'com.vardath.janus'" android/app/build.gradle
          grep -q "versionCode 115" android/app/build.gradle
          grep -q "versionName '1.15'" android/app/build.gradle
          grep -F "236215282074-7s6uj0tdeen1r3ptcpd2nlmkam97j0l3.apps.googleusercontent.com" android/app/build.gradle
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey > public-signing-certificate.txt
          sed -n 's/^[[:space:]]*SHA1:[[:space:]]*/Public tester APK SHA-1: /p' public-signing-certificate.txt | head -n1 | tee public-oauth-signing.txt

      - name: Compile Android client
        working-directory: android
        run: gradle --no-daemon :app:compileDebugJavaWithJavac --stacktrace

      - name: Assert compiled Google Web client ID
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_WEB_CLIENT='236215282074-7s6uj0tdeen1r3ptcpd2nlmkam97j0l3.apps.googleusercontent.com'
          BUILD_CONFIG=$(find android/app/build/generated -type f -name BuildConfig.java -path '*debug*' | head -n1)
          test -n "$BUILD_CONFIG"
          grep -F "$EXPECTED_WEB_CLIENT" "$BUILD_CONFIG" >/dev/null

      - name: Build tester APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Package tester APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          APK_NAME='JANUS-Android-v1.15-PUBLIC-TEST.apk'
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          sha256sum "$APK_NAME" > apk-sha256.txt
          {
            echo 'JANUS public Android tester build'
            echo 'Version: 1.15'
            echo 'Package: com.vardath.janus'
            echo 'Server: https://janus-global-core.onrender.com'
            echo 'Google Web OAuth client: 236215282074-7s6uj0tdeen1r3ptcpd2nlmkam97j0l3.apps.googleusercontent.com'
            cat public-oauth-signing.txt
            echo "Source commit: $GITHUB_SHA"
          } > public-build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: JANUS-Android-v1.15-PUBLIC-TEST
          path: |
            JANUS-Android-v1.15-PUBLIC-TEST.apk
            public-build-info.txt
            apk-sha256.txt
            public-signing-certificate.txt
            public-oauth-signing.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish public tester release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='public-test-v1.15'
          TITLE='JANUS v1.15 public tester'
          NOTES='Public tester APK. Package, compiled Google Web OAuth client ID and stable public tester signing certificate are recorded by CI. This is a test build, not the final Play release.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --prerelease --title "$TITLE" --notes "$NOTES"
          fi
          gh release upload "$TAG" JANUS-Android-v1.15-PUBLIC-TEST.apk public-build-info.txt apk-sha256.txt public-oauth-signing.txt --clobber
