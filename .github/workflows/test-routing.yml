name: Test JANUS Routing and Architecture

on:
  push:
    branches: [main]
    paths:
      - 'routing_policy.py'
      - 'saturation_regulation.py'
      - 'src/fano_core.py'
      - 'src/janus_sleep_cycle.py'
      - 'src/server.py.gz.b64.*'
      - 'core_sync.py'
      - 'dashboard_api.py'
      - 'deliberation_tasks.py'
      - 'janus_dashboard.py'
      - 'secure_desktop.py'
      - 'bootstrap.py'
      - 'render.yaml'
      - 'Dockerfile'
      - 'tools/rebuild_server.py'
      - 'tests/test_fano_semantics.py'
      - 'tests/test_saturation_regulation.py'
      - 'tests/test_routing_policy.py'
      - 'tests/test_architecture_contract.py'
      - 'tests/test_deliberation_tasks.py'
      - '.github/workflows/test-routing.yml'
  pull_request:
    paths:
      - 'routing_policy.py'
      - 'saturation_regulation.py'
      - 'src/fano_core.py'
      - 'src/janus_sleep_cycle.py'
      - 'src/server.py.gz.b64.*'
      - 'core_sync.py'
      - 'dashboard_api.py'
      - 'deliberation_tasks.py'
      - 'janus_dashboard.py'
      - 'secure_desktop.py'
      - 'bootstrap.py'
      - 'render.yaml'
      - 'Dockerfile'
      - 'tools/rebuild_server.py'
      - 'tests/test_fano_semantics.py'
      - 'tests/test_saturation_regulation.py'
      - 'tests/test_routing_policy.py'
      - 'tests/test_architecture_contract.py'
      - 'tests/test_deliberation_tasks.py'
      - '.github/workflows/test-routing.yml'
  workflow_dispatch:

jobs:
  routing-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Rebuild legacy base server
        run: python tools/rebuild_server.py
      - name: Run routing, Fano, saturation, architecture and deliberation regression suites
        run: python -m unittest -v tests.test_fano_semantics tests.test_saturation_regulation tests.test_routing_policy tests.test_architecture_contract tests.test_deliberation_tasks
