name: Build JANUS Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'server_v2/**', '.github/workflows/build-android.yml']
  pull_request:
    paths: ['android/**', 'server_v2/**', '.github/workflows/build-android.yml']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify authoritative native Android boundary
        shell: bash
        run: |
          set -euxo pipefail
          BASE=android/app/src/main/java/com/vardath/janus
          for f in MainActivity JanusApiClient JanusRoutePolicy JanusLocalCoreRuntime JanusLocalTypedSense JanusFanoPolicy JanusSensePolicy JanusUiPolish JanusSystemChrome JanusCoreMapView JanusReplyContextPolish JanusSourcePolish JanusGeneratedImagePolish JanusChatPresentation JanusChatResponseRegistry JanusChatController JanusChatHistoryStore JanusAdaptiveUi JanusApplication JanusOfflineQueue JanusMessagesScreen JanusObserveScreen JanusNavigationPolish JanusThoughtBridge JanusClientDiagnostics JanusMaintenanceSupervisorPolish; do test -s "$BASE/$f.java"; done
          test ! -e "$BASE/JanusChatV2Surface.java"
          test ! -e "$BASE/JanusChatHistoryBridge.java"
          test ! -e "$BASE/JanusThoughtContextPolish.java"
          test ! -e android/app/src/main/assets/index.html
          ! grep -R -q 'android.webkit.WebView\|JavascriptInterface' "$BASE"
          grep -q "versionName '1.08'" android/app/build.gradle
          grep -q "versionCode 108" android/app/build.gradle
          grep -q "applicationId 'com.vardath.janus'" android/app/build.gradle
      - name: Verify v1.08 governed self-diagnosis and Supervisor handoff
        shell: bash
        run: |
          set -euxo pipefail
          DIAG=server_v2/diagnostics.py
          CHAT=server_v2/chat.py
          MAINT=server_v2/maintenance.py
          ENTRY=server_v2/entrypoint.py
          API=android/app/src/main/java/com/vardath/janus/JanusApiClient.java
          CLIENT=android/app/src/main/java/com/vardath/janus/JanusClientDiagnostics.java
          HANDOFF=android/app/src/main/java/com/vardath/janus/JanusMaintenanceSupervisorPolish.java
          APP=android/app/src/main/java/com/vardath/janus/JanusApplication.java
          test -s "$DIAG"; test -s server_v2/supervisor_decisions.json
          grep -q 'v2_capability_requests' "$DIAG"
          grep -q 'v2_chat_history_full' "$DIAG"
          grep -q 'JANUS -> CHATGPT SUPERVISOR HANDOFF' "$DIAG"
          grep -q 'Review the private GitHub repository Vardath/JANUS thoroughly' "$DIAG"
          grep -q 'apply_supervisor_decisions' "$DIAG"
          grep -q 'JANUS itself did not make or execute this decision' "$DIAG"
          grep -q 'diagnostics.record_chat_turn' "$CHAT"
          grep -q 'diagnostics.inspect_chat' "$CHAT"
          grep -q 'user_visible_message' "$CHAT"
          grep -q '/maintenance/supervisor-handoff' "$MAINT"
          grep -q '/maintenance/diagnostics/report' "$MAINT"
          grep -q 'automatic_chatgpt_injection' "$MAINT"
          grep -q 'diagnostics.init_schema()' "$ENTRY"
          grep -q 'diagnostics.apply_supervisor_decisions()' "$ENTRY"
          grep -q 'j.put("user_visible_message", message)' "$API"
          grep -q 'Thread.UncaughtExceptionHandler' "$CLIENT"
          grep -q '/maintenance/diagnostics/report' "$CLIENT"
          grep -q 'Copy handoff' "$HANDOFF"
          grep -q 'Share to ChatGPT' "$HANDOFF"
          grep -q '/maintenance/supervisor-handoff' "$HANDOFF"
          grep -q 'JanusClientDiagnostics.install(this)' "$APP"
          grep -q 'JanusMaintenanceSupervisorPolish.install(activity)' "$APP"
          grep -q 'JanusClientDiagnostics.flushPending(activity)' "$APP"
          python -m py_compile server_v2/diagnostics.py server_v2/chat.py server_v2/maintenance.py server_v2/entrypoint.py server_v2/protocol.py server_v2/topology.py server_v2/senses.py server_v2/mind.py
      - name: Verify v1.07 system chrome, Back and Runtime Cores hardening remains intact
        shell: bash
        run: |
          set -euxo pipefail
          BASE=android/app/src/main/java/com/vardath/janus
          CHROME="$BASE/JanusSystemChrome.java"; MAP="$BASE/JanusCoreMapView.java"; NAV="$BASE/JanusNavigationPolish.java"; APP="$BASE/JanusApplication.java"; MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'enableOnBackInvokedCallback="true"' "$MANIFEST"
          grep -q 'getOnBackInvokedDispatcher' "$NAV"
          grep -q 'parent.performClick()' "$NAV"
          grep -q 'JanusSystemChrome.install(activity)' "$APP"
          grep -q 'theme_mode' "$CHROME"; grep -q 'accent' "$CHROME"
          ! grep -q 'LAYER_TYPE_SOFTWARE' "$MAP"
          ! grep -q 'setShadowLayer' "$MAP"
          grep -q 'drawFallback' "$MAP"
      - name: Verify active Fano and sensory contracts remain intact
        shell: bash
        run: |
          set -euxo pipefail
          BASE=android/app/src/main/java/com/vardath/janus
          THOUGHT="$BASE/JanusThoughtBridge.java"; FANO="$BASE/JanusFanoPolicy.java"; SENSE="$BASE/JanusSensePolicy.java"; CORE="$BASE/JanusLocalCoreRuntime.java"; API="$BASE/JanusApiClient.java"; ADAPTER="$BASE/JanusLocalTypedSense.java"
          grep -q 'between messages' "$THOUGHT"
          grep -q '\[DEVICE JANUS BACKGROUND-ACTIVITY CONTEXT\]' "$THOUGHT"
          grep -q 'Current Fano attention orientations' "$THOUGHT"
          grep -q 'JanusThoughtBridge.augment(JanusLocalCoreRuntime.get(appContext), message)' "$API"
          grep -q 'truth/grounding' "$FANO"; grep -q 'valence/welfare' "$FANO"; grep -q 'significance/conflict' "$FANO"; grep -q 'pattern/context' "$FANO"; grep -q 'understanding/model' "$FANO"; grep -q 'possibility/imagination' "$FANO"; grep -q 'continuity/experience' "$FANO"
          grep -q 'actionPosture' "$SENSE"; grep -q 'confidence' "$SENSE"; grep -q 'valence' "$SENSE"; grep -q 'risk' "$SENSE"; grep -q 'opportunity' "$SENSE"
          grep -q 'JanusFanoPolicy.directive(direction)' "$CORE"; grep -q 'active_orientation' "$CORE"; grep -q 'active_salience_percent' "$CORE"
          grep -q 'getDeclaredMethod' "$ADAPTER"
          grep -q 'broadcastSense' "$ADAPTER"
          grep -q 'serviceBurst' "$ADAPTER"
          grep -q '"persist"' "$ADAPTER"
          grep -q 'Fail closed' "$ADAPTER"
          grep -q 'path.startsWith("/auth/")' "$API"
          grep -q 'path.startsWith("/maintenance/")' "$API"
          grep -q 'JanusLocalTypedSense.ingest(appContext, "file"' "$API"
          grep -q 'JanusLocalTypedSense.ingest(appContext, "image"' "$API"
          grep -q 'JanusLocalTypedSense.ingest(appContext, "web"' "$API"
          grep -q 'JanusLocalTypedSense.ingest(appContext, "action_result"' "$API"
          grep -q 'Raw file bytes/base64, session tokens, passwords and authentication payloads' "$API"
          ! grep -q 'JanusLocalTypedSense.ingest(appContext, "text"' "$API"
      - name: Verify v1.04 Chat decoration performance regression remains fixed
        shell: bash
        run: |
          set -euxo pipefail
          BASE=android/app/src/main/java/com/vardath/janus
          UI="$BASE/JanusUiPolish.java"; SOURCES="$BASE/JanusSourcePolish.java"; IMAGES="$BASE/JanusGeneratedImagePolish.java"; REPLY="$BASE/JanusReplyContextPolish.java"
          grep -q 'CHAT_ENHANCED' "$UI"; grep -q 'BASE_POLISHED' "$UI"; grep -q 'POLISH_DEBOUNCE_MS' "$UI"
          ! grep -q 'layout.setTag("janus-chat-enhanced")' "$UI"
          grep -q 'MAIN.postDelayed(next, 220L)' "$SOURCES"; grep -q 'MAIN.postDelayed(next, 260L)' "$IMAGES"; grep -q 'MAIN.postDelayed(next, 240L)' "$REPLY"
      - name: Verify structured Chat and extracted screen ownership
        shell: bash
        run: |
          set -euxo pipefail
          BASE=android/app/src/main/java/com/vardath/janus; MAIN="$BASE/MainActivity.java"; QUEUE="$BASE/JanusOfflineQueue.java"
          grep -q 'JanusChatController.send(api, prepared)' "$MAIN"
          ! grep -q 'long\[\] waits' "$MAIN"
          grep -q 'JanusChatHistoryStore.append(this, "JANUS", reply, presentation)' "$MAIN"
          grep -q 'JSONArray a = JanusChatHistoryStore.read(this)' "$MAIN"
          grep -q 'offline_chat_replies_v2' "$QUEUE"
          grep -q 'JanusChatController.sendOnce(api, body.toString())' "$QUEUE"
          ! grep -q 'HttpURLConnection' "$QUEUE"
          grep -q 'WindowInsetsCompat.Type.systemBars()' "$BASE/JanusUiPolish.java"
          CORE="$BASE/JanusLocalCoreRuntime.java"; grep -q 'Strictly forward-only routing' "$CORE"; ! grep -q 'send("interface", "consensus"' "$CORE"; grep -q '\[feedback-only global\]' "$CORE"
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.11.1' }
      - name: Restore stable debug signing key
        uses: actions/cache@v5
        with: { path: ~/.android/debug.keystore, key: janus-android-debug-keystore-v1 }
      - name: Ensure stable debug signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"; fi
      - name: Compile authoritative Java client
        working-directory: android
        env: { JANUS_GOOGLE_WEB_CLIENT_ID: '${{ secrets.JANUS_GOOGLE_WEB_CLIENT_ID }}' }
        run: gradle --no-daemon :app:compileDebugJavaWithJavac --stacktrace -PJANUS_GOOGLE_WEB_CLIENT_ID="$JANUS_GOOGLE_WEB_CLIENT_ID"
      - name: Build debug APK
        working-directory: android
        env: { JANUS_GOOGLE_WEB_CLIENT_ID: '${{ secrets.JANUS_GOOGLE_WEB_CLIENT_ID }}' }
        run: gradle --no-daemon :app:assembleDebug --stacktrace -PJANUS_GOOGLE_WEB_CLIENT_ID="$JANUS_GOOGLE_WEB_CLIENT_ID"
      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" android/app/build.gradle | head -n1)
          test -n "$VERSION"; echo "version=$VERSION" >> "$GITHUB_OUTPUT"; echo "apk_name=JANUS-Android-v$VERSION-FULL-REBUILD.apk" >> "$GITHUB_OUTPUT"
      - name: Copy APK and record build identity
        shell: bash
        env: { VERSION: '${{ steps.app_version.outputs.version }}', APK_NAME: '${{ steps.app_version.outputs.apk_name }}' }
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          printf 'JANUS Android authoritative native build identity\nVersion: %s\nPackage: com.vardath.janus\nSource commit: %s\nUI: v1.08 governed self-diagnosis + owner-controlled ChatGPT Supervisor handoff + crash replay diagnostics; v1.07 themed system bars/Back/Cores hardening retained\nArchitecture migration: conceptual 1-3-7; mechanical 7 subconscious -> 2 hemispheres -> Front -> Interface; local runtime compatibility migration in progress\n' "$VERSION" "$GITHUB_SHA" > oauth-build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JANUS-Android-v${{ steps.app_version.outputs.version }}-FULL-REBUILD
          path: |
            ${{ steps.app_version.outputs.apk_name }}
            oauth-build-info.txt
          if-no-files-found: error
      - name: Publish direct-download APK branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env: { VERSION: '${{ steps.app_version.outputs.version }}', APK_NAME: '${{ steps.app_version.outputs.apk_name }}' }
        run: |
          mkdir -p /tmp/janus-apk && cp "$APK_NAME" oauth-build-info.txt /tmp/janus-apk/
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-download && git rm -rf . && mkdir -p downloads
          cp "/tmp/janus-apk/$APK_NAME" downloads/; cp /tmp/janus-apk/oauth-build-info.txt downloads/
          printf '# JANUS Android downloads\n\nLatest authoritative native APK: %s\n' "$APK_NAME" > README.md
          git add README.md downloads && git commit -m "Publish JANUS Android native v$VERSION" && git push --force origin HEAD:apk-download
