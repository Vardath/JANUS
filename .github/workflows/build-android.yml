name: Build JANUS Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace
      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk JANUS-Android-v0.17.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JANUS-Android-v0.17
          path: JANUS-Android-v0.17.apk
          if-no-files-found: error
