name: Build JANUS Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Restore stable debug signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: janus-android-debug-keystore-v1

      - name: Ensure stable debug signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Show Google OAuth signing fingerprints
        shell: bash
        run: |
          echo "JANUS Android debug signing certificate:"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep -E 'SHA1:|SHA256:'

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" android/app/build.gradle | head -n1)
          if [ -z "$VERSION" ]; then
            echo "Could not determine Android versionName" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=JANUS-Android-v$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "Building JANUS Android v$VERSION"

      - name: Build debug APK
        working-directory: android
        env:
          JANUS_GOOGLE_WEB_CLIENT_ID: ${{ secrets.JANUS_GOOGLE_WEB_CLIENT_ID }}
        run: gradle :app:assembleDebug --stacktrace -PJANUS_GOOGLE_WEB_CLIENT_ID="$JANUS_GOOGLE_WEB_CLIENT_ID"

      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "${{ steps.app_version.outputs.apk_name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: JANUS-Android-v${{ steps.app_version.outputs.version }}
          path: ${{ steps.app_version.outputs.apk_name }}
          if-no-files-found: error

      - name: Publish direct-download APK branch
        shell: bash
        env:
          VERSION: ${{ steps.app_version.outputs.version }}
          APK_NAME: ${{ steps.app_version.outputs.apk_name }}
        run: |
          mkdir -p /tmp/janus-apk
          cp "$APK_NAME" /tmp/janus-apk/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-download
          git rm -rf .
          mkdir -p downloads
          cp "/tmp/janus-apk/$APK_NAME" downloads/
          printf '# JANUS Android downloads\n\nLatest debug APK: %s\n' "$APK_NAME" > README.md
          git add README.md "downloads/$APK_NAME"
          git commit -m "Publish JANUS Android v$VERSION APK"
          git push --force origin HEAD:apk-download
