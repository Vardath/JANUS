name: Build JANUS Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify authoritative native Android boundary
        shell: bash
        run: |
          set -euxo pipefail
          BASE=android/app/src/main/java/com/vardath/janus
          for f in MainActivity JanusApiClient JanusRoutePolicy JanusLocalCoreRuntime JanusUiPolish JanusReplyContextPolish JanusSourcePolish JanusChatPresentation JanusChatResponseRegistry JanusChatController JanusAdaptiveUi JanusApplication; do test -s "$BASE/$f.java"; done
          test ! -e android/app/src/main/assets/index.html
          ! grep -R -q 'android.webkit.WebView\|JavascriptInterface' "$BASE"
          grep -q "versionName '0.95'" android/app/build.gradle
          grep -q "applicationId 'com.vardath.janus'" android/app/build.gradle
      - name: Verify v0.95 structured Chat persistence/controller contracts
        shell: bash
        run: |
          set -euxo pipefail
          BASE=android/app/src/main/java/com/vardath/janus
          grep -q 'JanusChatResponseRegistry.capture(responseBody)' "$BASE/JanusApiClient.java"
          grep -q 'JanusChatResponseRegistry.init(this)' "$BASE/JanusApplication.java"
          grep -q 'janus_chat_presentation_v095' "$BASE/JanusChatResponseRegistry.java"
          grep -q 'prefs.edit().putString(KEY' "$BASE/JanusChatResponseRegistry.java"
          grep -q 'JanusChatPresentation.fromStored' "$BASE/JanusChatResponseRegistry.java"
          grep -q 'JSONObject toJson' "$BASE/JanusChatPresentation.java"
          grep -q 'JanusChatPresentation fromStored' "$BASE/JanusChatPresentation.java"
          grep -q 'class JanusChatController' "$BASE/JanusChatController.java"
          grep -q 'RETRY_DELAYS_MS' "$BASE/JanusChatController.java"
          grep -q 'buildPanel(activity,p.sources)' "$BASE/JanusSourcePolish.java"
          grep -q 'WindowInsetsCompat.Type.systemBars()' "$BASE/JanusUiPolish.java"
          grep -q 'Replying to JANUS' "$BASE/JanusReplyContextPolish.java"
          grep -q 'JanusRoutePolicy.sanitizeAuthenticatedPath(path)' "$BASE/JanusApiClient.java"
          CORE="$BASE/JanusLocalCoreRuntime.java"
          grep -q 'Strictly forward-only routing' "$CORE"
          ! grep -q 'send("interface", "consensus"' "$CORE"
          grep -q '\[feedback-only global\]' "$CORE"
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.11.1' }
      - name: Restore stable debug signing key
        uses: actions/cache@v5
        with: { path: ~/.android/debug.keystore, key: janus-android-debug-keystore-v1 }
      - name: Ensure stable debug signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"; fi
      - name: Compile authoritative Java client
        working-directory: android
        env: { JANUS_GOOGLE_WEB_CLIENT_ID: '${{ secrets.JANUS_GOOGLE_WEB_CLIENT_ID }}' }
        run: gradle --no-daemon :app:compileDebugJavaWithJavac --stacktrace -PJANUS_GOOGLE_WEB_CLIENT_ID="$JANUS_GOOGLE_WEB_CLIENT_ID"
      - name: Build debug APK
        working-directory: android
        env: { JANUS_GOOGLE_WEB_CLIENT_ID: '${{ secrets.JANUS_GOOGLE_WEB_CLIENT_ID }}' }
        run: gradle --no-daemon :app:assembleDebug --stacktrace -PJANUS_GOOGLE_WEB_CLIENT_ID="$JANUS_GOOGLE_WEB_CLIENT_ID"
      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" android/app/build.gradle | head -n1)
          test -n "$VERSION"; echo "version=$VERSION" >> "$GITHUB_OUTPUT"; echo "apk_name=JANUS-Android-v$VERSION-FULL-REBUILD.apk" >> "$GITHUB_OUTPUT"
      - name: Copy APK and record build identity
        shell: bash
        env: { VERSION: '${{ steps.app_version.outputs.version }}', APK_NAME: '${{ steps.app_version.outputs.apk_name }}' }
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          printf 'JANUS Android authoritative native build identity\nVersion: %s\nPackage: com.vardath.janus\nSource commit: %s\nUI: persistent structured Chat source/image metadata + controller extraction foundation + safe areas/accessibility; no WebView\nArchitecture: 7 specialists -> 2 hemispheres -> Consensus -> Interface\n' "$VERSION" "$GITHUB_SHA" > oauth-build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JANUS-Android-v${{ steps.app_version.outputs.version }}-FULL-REBUILD
          path: |
            ${{ steps.app_version.outputs.apk_name }}
            oauth-build-info.txt
          if-no-files-found: error
      - name: Publish direct-download APK branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env: { VERSION: '${{ steps.app_version.outputs.version }}', APK_NAME: '${{ steps.app_version.outputs.apk_name }}' }
        run: |
          mkdir -p /tmp/janus-apk && cp "$APK_NAME" oauth-build-info.txt /tmp/janus-apk/
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-download && git rm -rf . && mkdir -p downloads
          cp "/tmp/janus-apk/$APK_NAME" downloads/; cp /tmp/janus-apk/oauth-build-info.txt downloads/
          printf '# JANUS Android downloads\n\nLatest authoritative native APK: %s\n' "$APK_NAME" > README.md
          git add README.md downloads && git commit -m "Publish JANUS Android native v$VERSION" && git push --force origin HEAD:apk-download
