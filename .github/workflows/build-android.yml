name: Build JANUS Android APK
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/build-android.yml']
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify authoritative native Android boundary
        shell: bash
        run: |
          set -euxo pipefail
          BASE=android/app/src/main/java/com/vardath/janus
          for f in MainActivity JanusApiClient JanusRoutePolicy JanusLocalCoreRuntime JanusUiPolish JanusReplyContextPolish JanusSourcePolish JanusGeneratedImagePolish JanusChatPresentation JanusChatResponseRegistry JanusChatController JanusChatHistoryStore JanusAdaptiveUi JanusApplication JanusOfflineQueue JanusMessagesScreen JanusObserveScreen; do test -s "$BASE/$f.java"; done
          test ! -e "$BASE/JanusChatV2Surface.java"
          test ! -e "$BASE/JanusChatHistoryBridge.java"
          test ! -e android/app/src/main/assets/index.html
          ! grep -R -q 'android.webkit.WebView\|JavascriptInterface' "$BASE"
          grep -q "versionName '1.04'" android/app/build.gradle
          grep -q "versionCode 104" android/app/build.gradle
          grep -q "applicationId 'com.vardath.janus'" android/app/build.gradle
      - name: Verify v1.04 Chat decoration performance regression
        shell: bash
        run: |
          set -euxo pipefail
          BASE=android/app/src/main/java/com/vardath/janus
          UI="$BASE/JanusUiPolish.java"
          SOURCES="$BASE/JanusSourcePolish.java"
          IMAGES="$BASE/JanusGeneratedImagePolish.java"
          REPLY="$BASE/JanusReplyContextPolish.java"
          grep -q 'CHAT_ENHANCED' "$UI"
          grep -q 'BASE_POLISHED' "$UI"
          grep -q 'POLISH_DEBOUNCE_MS' "$UI"
          ! grep -q 'layout.setTag("janus-chat-enhanced")' "$UI"
          grep -q 'child instanceof TextView && !(child instanceof Button)' "$UI"
          grep -q 'MAIN.postDelayed(next, 220L)' "$SOURCES"
          grep -q 'MAIN.postDelayed(next, 260L)' "$IMAGES"
          grep -q 'MAIN.postDelayed(next, 240L)' "$REPLY"
          for f in "$UI" "$SOURCES" "$IMAGES" "$REPLY"; do grep -q 'Map<Activity, Runnable> PENDING' "$f"; done
      - name: Verify v1.04 structured Chat and extracted screen ownership
        shell: bash
        run: |
          set -euxo pipefail
          BASE=android/app/src/main/java/com/vardath/janus
          MAIN="$BASE/MainActivity.java"
          QUEUE="$BASE/JanusOfflineQueue.java"
          test -s "$BASE/JanusMessagesScreen.java"
          test -s "$BASE/JanusObserveScreen.java"
          grep -q 'JanusChatController.send(api, prepared)' "$MAIN"
          ! grep -q 'long\[\] waits' "$MAIN"
          ! grep -q 'formatSources(' "$MAIN"
          grep -q 'formatResearchSources' "$MAIN"
          grep -q 'JanusChatHistoryStore.append(this, "JANUS", reply, presentation)' "$MAIN"
          grep -q 'JSONArray a = JanusChatHistoryStore.read(this)' "$MAIN"
          grep -q 'JanusChatResponseRegistry.remember(presentation)' "$MAIN"
          grep -q 'public static synchronized void remember' "$BASE/JanusChatResponseRegistry.java"
          grep -q 'chat_history_native_v2' "$BASE/JanusChatHistoryStore.java"
          grep -q 'migrateLegacyOnce' "$BASE/JanusChatHistoryStore.java"
          grep -q 'offline_chat_replies_v2' "$QUEUE"
          grep -q 'presentation.toJson()' "$QUEUE"
          grep -q 'JanusChatResponseRegistry.capture(context, rawResponse)' "$QUEUE"
          grep -q 'JanusChatController.sendOnce(api, body.toString())' "$QUEUE"
          ! grep -q 'HttpURLConnection' "$QUEUE"
          grep -q 'JanusGeneratedImagePolish.install(activity)' "$BASE/JanusApplication.java"
          grep -q 'buildPanel(activity,p.sources)' "$BASE/JanusSourcePolish.java"
          grep -q 'WindowInsetsCompat.Type.systemBars()' "$BASE/JanusUiPolish.java"
          grep -q 'Replying to JANUS' "$BASE/JanusReplyContextPolish.java"
          grep -q 'JanusRoutePolicy.sanitizeAuthenticatedPath(path)' "$BASE/JanusApiClient.java"
          CORE="$BASE/JanusLocalCoreRuntime.java"
          grep -q 'Strictly forward-only routing' "$CORE"
          ! grep -q 'send("interface", "consensus"' "$CORE"
          grep -q '\[feedback-only global\]' "$CORE"
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.11.1' }
      - name: Restore stable debug signing key
        uses: actions/cache@v5
        with: { path: ~/.android/debug.keystore, key: janus-android-debug-keystore-v1 }
      - name: Ensure stable debug signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"; fi
      - name: Compile authoritative Java client
        working-directory: android
        env: { JANUS_GOOGLE_WEB_CLIENT_ID: '${{ secrets.JANUS_GOOGLE_WEB_CLIENT_ID }}' }
        run: gradle --no-daemon :app:compileDebugJavaWithJavac --stacktrace -PJANUS_GOOGLE_WEB_CLIENT_ID="$JANUS_GOOGLE_WEB_CLIENT_ID"
      - name: Build debug APK
        working-directory: android
        env: { JANUS_GOOGLE_WEB_CLIENT_ID: '${{ secrets.JANUS_GOOGLE_WEB_CLIENT_ID }}' }
        run: gradle --no-daemon :app:assembleDebug --stacktrace -PJANUS_GOOGLE_WEB_CLIENT_ID="$JANUS_GOOGLE_WEB_CLIENT_ID"
      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" android/app/build.gradle | head -n1)
          test -n "$VERSION"; echo "version=$VERSION" >> "$GITHUB_OUTPUT"; echo "apk_name=JANUS-Android-v$VERSION-FULL-REBUILD.apk" >> "$GITHUB_OUTPUT"
      - name: Copy APK and record build identity
        shell: bash
        env: { VERSION: '${{ steps.app_version.outputs.version }}', APK_NAME: '${{ steps.app_version.outputs.apk_name }}' }
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          printf 'JANUS Android authoritative native build identity\nVersion: %s\nPackage: com.vardath.janus\nSource commit: %s\nUI: v1.04 idempotent/debounced Chat decoration + structured history + persistent sources/generated images + extracted Messages/Observe ownership; no WebView\nArchitecture: 7 specialists -> 2 hemispheres -> Consensus -> Interface\n' "$VERSION" "$GITHUB_SHA" > oauth-build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JANUS-Android-v${{ steps.app_version.outputs.version }}-FULL-REBUILD
          path: |
            ${{ steps.app_version.outputs.apk_name }}
            oauth-build-info.txt
          if-no-files-found: error
      - name: Publish direct-download APK branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env: { VERSION: '${{ steps.app_version.outputs.version }}', APK_NAME: '${{ steps.app_version.outputs.apk_name }}' }
        run: |
          mkdir -p /tmp/janus-apk && cp "$APK_NAME" oauth-build-info.txt /tmp/janus-apk/
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-download && git rm -rf . && mkdir -p downloads
          cp "/tmp/janus-apk/$APK_NAME" downloads/; cp /tmp/janus-apk/oauth-build-info.txt downloads/
          printf '# JANUS Android downloads\n\nLatest authoritative native APK: %s\n' "$APK_NAME" > README.md
          git add README.md downloads && git commit -m "Publish JANUS Android native v$VERSION" && git push --force origin HEAD:apk-download
