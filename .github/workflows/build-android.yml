name: Build JANUS Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'tools/patch_android_forward_routing.py'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Disable legacy Observe DOM override
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          marker = "let profile='',token=localStorage.janusToken||'',accountId=localStorage.janusAccountId||'',seq=0,pending={},timer=null,observeMode='all',lastObserveKey='';"
          guard = """(function(){let legacyLocalEvidence=null;Object.defineProperty(window,'janusLocalEvidence',{configurable:false,get:function(){return function(p){if(p==='observe')return;if(legacyLocalEvidence)return legacyLocalEvidence(p);};},set:function(fn){legacyLocalEvidence=fn;}});})();\n"""
          if guard.strip() not in s:
              if marker not in s:
                  raise SystemExit('Observe guard insertion point not found')
              s = s.replace(marker, guard + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Add device-local Interface outbox
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</script></body></html>'
          block = r'''
(function(){
  if(window.__janusLocalOutboxInstalled)return;
  window.__janusLocalOutboxInstalled=true;
  function stateMap(){try{return JSON.parse(localStorage.janusLocalMessageState||'{}')||{}}catch(e){return {}}}
  function saveState(m){try{localStorage.janusLocalMessageState=JSON.stringify(m)}catch(e){}}
  function localRows(){
    try{
      let r=JSON.parse(Android.localCoreStatus()||'{}'),states=stateMap(),rows=[];
      for(let x of (r.observe_events||[])){
        if(String(x.core_name||'')!=='interface'||String(x.event_type||'')!=='process_note')continue;
        let raw=String(x.raw_detail||x.detail||''),low=raw.toLowerCase();
        if(!low.includes('autonomous')&&!low.includes('self-assessment')&&!low.includes('self_assessment'))continue;
        let key=String(x.event_id||x.created_at||('i'+rows.length)),state=states[key]||'unread';
        if(state==='dismissed')continue;
        let at=x.created_at;
        if(typeof at==='number'||/^\d+$/.test(String(at||''))){try{at=new Date(Number(at)).toISOString()}catch(e){}}
        let item={id:'local:'+key,local:true,local_key:key,state:state,message_type:'Observation',created_at:String(at||''),source:'this device',detail:friendlyThought({core_name:'interface',event_type:'process_note',detail:x.detail||'',raw_detail:raw})};
        rows.push(item);
      }
      rows.sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
      let seen=new Set(),out=[];
      for(let x of rows){let sig=String(x.detail||'').trim().toLowerCase();if(!sig||seen.has(sig))continue;seen.add(sig);out.push(x);if(out.length>=20)break}
      return out;
    }catch(e){return []}
  }
  window.localSetMsg=function(key,state){let m=stateMap();m[String(key)]=state;saveState(m);refresh('messages')};
  window.localAnswer=function(key){let x=(window.messageRows||[]).find(y=>y.local&&y.local_key===String(key));if(!x)return;localSetMsg(key,'read');composer.value=`Regarding your local ${x.message_type||'message'} from ${fmt(x.created_at)}:\n“${String(x.detail||'').slice(0,500)}”\n\n`;show('chat');composer.focus()};
  function renderMergedMessages(serverRows,serverUnread){
    serverRows=Array.isArray(serverRows)?serverRows:[];
    let serverText=new Set(serverRows.map(x=>String(x.detail||'').trim().toLowerCase())),locals=localRows().filter(x=>!serverText.has(String(x.detail||'').trim().toLowerCase()));
    let rows=[...locals,...serverRows].sort((a,b)=>String(b.created_at||'').localeCompare(String(a.created_at||'')));
    window.messageRows=rows;
    let localUnread=locals.filter(x=>x.state==='unread').length;
    setBadges(Number(serverUnread||0)+localUnread);
    messageList.innerHTML=rows.map(x=>{
      if(x.local){return `<div class="card"><b>${x.state==='unread'?'New · ':''}${esc(x.message_type||'Observation')}</b><div class="small">${fmt(x.created_at)} · this device</div><p>${esc(x.detail||'')}</p><button class="action" onclick="localAnswer('${esc(x.local_key)}')">Answer in Chat</button> <button class="action secondary" onclick="localSetMsg('${esc(x.local_key)}','read')">Read</button> <button class="action secondary" onclick="localSetMsg('${esc(x.local_key)}','dismissed')">Dismiss</button></div>`}
      return `<div class="card"><b>${x.state==='unread'?'New · ':''}${esc(x.message_type||'Follow-up')}</b><div class="small">${fmt(x.created_at)}</div><p>${esc(x.detail||'')}</p><button class="action" onclick="answerInChat(${x.id})">Answer in Chat</button> <button class="action secondary" onclick="setMsg(${x.id},'read')">Read</button> <button class="action secondary" onclick="setMsg(${x.id},'dismissed')">Dismiss</button></div>`
    }).join('')||'<p>No JANUS messages yet.</p>';
  }
  if(window.refresh&&!window.__janusLocalOutboxRefreshWrapped){
    window.__janusLocalOutboxRefreshWrapped=true;
    let oldRefresh=window.refresh;
    window.refresh=async function(p){
      if(p!=='messages')return oldRefresh(p);
      let before=(window.messageRows||[]).slice(),serverUnread=0;
      try{let r=await api('GET','/desktop/messages?username='+encodeURIComponent(profile));before=r.items||[];serverUnread=Number(r.unread||0)}catch(e){setStatus('Offline · local runtime available')}
      renderMergedMessages(before,serverUnread);
    };
  }
})();
'''
          if '__janusLocalOutboxInstalled' not in s:
              if marker not in s:
                  raise SystemExit('Local outbox insertion point not found')
              s = s.replace(marker, block + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Enforce forward-only local core routing
        shell: bash
        run: python tools/patch_android_forward_routing.py

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Restore stable debug signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: janus-android-debug-keystore-v1

      - name: Ensure stable debug signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Show Google OAuth signing fingerprints
        shell: bash
        run: |
          echo "JANUS Android debug signing certificate:"
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep -E 'SHA1:|SHA256:'

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" android/app/build.gradle | head -n1)
          if [ -z "$VERSION" ]; then
            echo "Could not determine Android versionName" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=JANUS-Android-v$VERSION.apk" >> "$GITHUB_OUTPUT"
          echo "Building JANUS Android v$VERSION"

      - name: Build debug APK
        working-directory: android
        env:
          JANUS_GOOGLE_WEB_CLIENT_ID: ${{ secrets.JANUS_GOOGLE_WEB_CLIENT_ID }}
        run: gradle :app:assembleDebug --stacktrace -PJANUS_GOOGLE_WEB_CLIENT_ID="$JANUS_GOOGLE_WEB_CLIENT_ID"

      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "${{ steps.app_version.outputs.apk_name }}"

      - name: Record exact OAuth build identity
        shell: bash
        env:
          JANUS_GOOGLE_WEB_CLIENT_ID: ${{ secrets.JANUS_GOOGLE_WEB_CLIENT_ID }}
        run: |
          set +e
          {
            echo "JANUS Android OAuth build identity"
            echo "Version: ${{ steps.app_version.outputs.version }}"
            echo "Package: com.vardath.janus"
            echo "Signing certificate from build keystore:"
            keytool -list -v \
              -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey \
              -storepass android \
              -keypass android | grep -E 'SHA1:|SHA256:' || true
            APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n1)
            if [ -n "$APKSIGNER" ]; then
              echo "Finished APK certificate:"
              "$APKSIGNER" verify --print-certs "${{ steps.app_version.outputs.apk_name }}" 2>/dev/null | grep -E 'SHA-1 digest:|SHA-256 digest:' || true
            else
              echo "Finished APK certificate: apksigner unavailable; build keystore values above are authoritative for this debug build."
            fi
            BUILD_CONFIG=$(find android/app/build/generated -type f -name BuildConfig.java 2>/dev/null | head -n1)
            if [ -n "$BUILD_CONFIG" ]; then
              grep 'GOOGLE_WEB_CLIENT_ID' "$BUILD_CONFIG" | sed 's/^[[:space:]]*//' || true
            else
              echo "Generated BuildConfig.java not found."
            fi
            if [ -n "$JANUS_GOOGLE_WEB_CLIENT_ID" ]; then
              echo "Workflow OAuth client configured: yes"
              echo "Workflow OAuth client suffix: ${JANUS_GOOGLE_WEB_CLIENT_ID:0:15}...${JANUS_GOOGLE_WEB_CLIENT_ID: -24}"
            else
              echo "Workflow OAuth client configured: no; Gradle fallback will be used"
            fi
          } | tee oauth-build-info.txt
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: JANUS-Android-v${{ steps.app_version.outputs.version }}
          path: |
            ${{ steps.app_version.outputs.apk_name }}
            oauth-build-info.txt
          if-no-files-found: error

      - name: Publish direct-download APK branch
        shell: bash
        env:
          VERSION: ${{ steps.app_version.outputs.version }}
          APK_NAME: ${{ steps.app_version.outputs.apk_name }}
        run: |
          mkdir -p /tmp/janus-apk
          cp "$APK_NAME" /tmp/janus-apk/
          cp oauth-build-info.txt /tmp/janus-apk/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-download
          git rm -rf .
          mkdir -p downloads
          cp "/tmp/janus-apk/$APK_NAME" downloads/
          cp /tmp/janus-apk/oauth-build-info.txt downloads/
          printf '# JANUS Android downloads\n\nLatest debug APK: %s\n\n## OAuth build identity\n\n```text\n' "$APK_NAME" > README.md
          cat /tmp/janus-apk/oauth-build-info.txt >> README.md
          printf '\n```\n' >> README.md
          git add README.md "downloads/$APK_NAME" downloads/oauth-build-info.txt
          git commit -m "Publish JANUS Android v$VERSION APK"
          git push --force origin HEAD:apk-download
