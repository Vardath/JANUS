name: Build JANUS Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Verify authoritative native product boundary
        shell: bash
        run: |
          set -euxo pipefail
          SRC=android/app/src/main/java/com/vardath/janus/MainActivity.java
          API=android/app/src/main/java/com/vardath/janus/JanusApiClient.java
          CORE=android/app/src/main/java/com/vardath/janus/JanusLocalCoreRuntime.java
          POLISH=android/app/src/main/java/com/vardath/janus/JanusUiPolish.java
          APP=android/app/src/main/java/com/vardath/janus/JanusApplication.java
          MAN=android/app/src/main/AndroidManifest.xml
          GRADLE=android/app/build.gradle
          test -s "$SRC" && test -s "$API" && test -s "$CORE" && test -s "$POLISH" && test -s "$APP" && test -s "$MAN" && test -s "$GRADLE"
          test ! -e android/app/src/main/assets/index.html
          ! grep -R -q 'android.webkit.WebView\|JavascriptInterface' android/app/src/main/java
          grep -q 'class MainActivity extends Activity' "$SRC"
          grep -q "applicationId 'com.vardath.janus'" "$GRADLE"
          grep -q "versionName '0.84'" "$GRADLE"
          test "$(grep -o 'android.intent.category.LAUNCHER' "$MAN" | wc -l)" -eq 1

      - name: Verify safe-area and Chat polish contract
        shell: bash
        run: |
          set -euxo pipefail
          POLISH=android/app/src/main/java/com/vardath/janus/JanusUiPolish.java
          APP=android/app/src/main/java/com/vardath/janus/JanusApplication.java
          MAN=android/app/src/main/AndroidManifest.xml
          grep -q 'WindowCompat.setDecorFitsSystemWindows(window, false)' "$POLISH"
          grep -q 'WindowInsetsCompat.Type.systemBars()' "$POLISH"
          grep -q 'WindowInsetsCompat.Type.ime()' "$POLISH"
          grep -q 'Math.max(bars.bottom, ime.bottom)' "$POLISH"
          grep -q 'JanusUiPolish.install(activity)' "$APP"
          grep -q 'android:windowSoftInputMode="adjustResize"' "$MAN"
          grep -q 'enhanceChatCard' "$POLISH"
          grep -q 'Copied JANUS response' "$POLISH"
          grep -q 'Share JANUS response' "$POLISH"
          grep -q 'Delivery status' "$POLISH"
          grep -q 'styleImage' "$POLISH"
          grep -q 'setTextIsSelectable(true)' "$POLISH"

      - name: Verify complete product surface
        shell: bash
        run: |
          set -euxo pipefail
          SRC=android/app/src/main/java/com/vardath/janus/MainActivity.java
          for marker in \
            'Username or email' 'Create account' 'Continue with Google' \
            'Forgot password' 'Reset password' 'Verify / resend email' \
            '"Chat", "Messages", "Observe", "Options"' \
            'Research Workspace' 'Artifacts' 'Background Research' \
            'Maintenance Review' 'System Status' 'Compatibility' \
            'Runtime Cores' 'Memory' 'Activity' 'Settings' 'Account'; do
            grep -q "$marker" "$SRC"
          done
          grep -q 'Report response' "$SRC"
          grep -q 'MAX_ATTACHMENTS = 4' "$SRC"
          grep -q 'ACTION_OPEN_DOCUMENT' "$SRC"
          grep -q 'ACTION_CREATE_DOCUMENT' "$SRC"
          grep -q 'ACTION_SEND' "$SRC"
          grep -q 'FileProvider.getUriForFile' "$SRC"

      - name: Verify server contract coverage
        shell: bash
        run: |
          set -euxo pipefail
          SRC=android/app/src/main/java/com/vardath/janus/MainActivity.java
          for route in \
            '/auth/login' '/auth/register' '/auth/google' '/auth/me' \
            '/auth/forgot-password' '/auth/reset-password' '/auth/verify-email' \
            '/desktop/chat' '/desktop/messages?username=' '/desktop/core-observe?username=' \
            '/desktop/runtime-cores?username=' '/desktop/memory?username=' '/desktop/activity?username=' \
            '/files/upload' '/artifacts' '/research/workspace' '/research-provenance/status' \
            '/maintenance/status' '/protocol/capabilities' '/diagnostics/runtime-health' '/safety/report'; do
            grep -q "$route" "$SRC"
          done
          grep -q 'client_message_id' "$SRC"
          grep -q 'attachment_ids' "$SRC"
          grep -q 'local_runtime_evidence' "$SRC"
          grep -q 'JanusOfflineQueue.enqueue' "$SRC"
          grep -q 'JanusOfflineQueue.flush' "$SRC"

      - name: Verify local 11-core architectural invariants
        shell: bash
        run: |
          set -euxo pipefail
          CORE=android/app/src/main/java/com/vardath/janus/JanusLocalCoreRuntime.java
          grep -q 'Strictly forward-only routing' "$CORE"
          grep -q 'send(from, "left_hemisphere"' "$CORE"
          grep -q 'send(from, "right_hemisphere"' "$CORE"
          grep -q 'send(from, "consensus"' "$CORE"
          grep -q 'send(from, "interface"' "$CORE"
          ! grep -q 'send("interface", "consensus"' "$CORE"
          ! grep -q 'send("consensus", "left_hemisphere"' "$CORE"
          ! grep -q 'send("consensus", "right_hemisphere"' "$CORE"
          grep -q '\[feedback-only global\]' "$CORE"
          grep -q 'core_cycle_api_calls' "$CORE"
          grep -q 'background_cycles_enabled' "$CORE"
          grep -q 'observe_telemetry_enabled' "$CORE"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Restore stable debug signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: janus-android-debug-keystore-v1

      - name: Ensure stable debug signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Compile authoritative Java client
        working-directory: android
        env:
          JANUS_GOOGLE_WEB_CLIENT_ID: ${{ secrets.JANUS_GOOGLE_WEB_CLIENT_ID }}
        run: gradle --no-daemon :app:compileDebugJavaWithJavac --stacktrace -PJANUS_GOOGLE_WEB_CLIENT_ID="$JANUS_GOOGLE_WEB_CLIENT_ID"

      - name: Build debug APK
        working-directory: android
        env:
          JANUS_GOOGLE_WEB_CLIENT_ID: ${{ secrets.JANUS_GOOGLE_WEB_CLIENT_ID }}
        run: gradle --no-daemon :app:assembleDebug --stacktrace -PJANUS_GOOGLE_WEB_CLIENT_ID="$JANUS_GOOGLE_WEB_CLIENT_ID"

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\([^']*\)'.*/\1/p" android/app/build.gradle | head -n1)
          test -n "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=JANUS-Android-v$VERSION-FULL-REBUILD.apk" >> "$GITHUB_OUTPUT"

      - name: Copy APK and record build identity
        shell: bash
        env:
          VERSION: ${{ steps.app_version.outputs.version }}
          APK_NAME: ${{ steps.app_version.outputs.apk_name }}
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"
          {
            echo "JANUS Android authoritative native build identity"
            echo "Version: $VERSION"
            echo "Package: com.vardath.janus"
            echo "Source commit: $GITHUB_SHA"
            echo "UI: native Android safe areas + Chat readability/actions; no WebView"
            echo "Architecture: 7 specialists -> 2 hemispheres -> Consensus -> Interface"
            echo "Signing certificate from stable build keystore:"
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep -E 'SHA1:|SHA256:' || true
          } > oauth-build-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: JANUS-Android-v${{ steps.app_version.outputs.version }}-FULL-REBUILD
          path: |
            ${{ steps.app_version.outputs.apk_name }}
            oauth-build-info.txt
          if-no-files-found: error

      - name: Publish direct-download APK branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          VERSION: ${{ steps.app_version.outputs.version }}
          APK_NAME: ${{ steps.app_version.outputs.apk_name }}
        run: |
          mkdir -p /tmp/janus-apk
          cp "$APK_NAME" /tmp/janus-apk/
          cp oauth-build-info.txt /tmp/janus-apk/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-download
          git rm -rf .
          mkdir -p downloads
          cp "/tmp/janus-apk/$APK_NAME" downloads/
          cp /tmp/janus-apk/oauth-build-info.txt downloads/
          printf '# JANUS Android downloads\n\nLatest authoritative native APK: %s\n\n## Build identity\n\n```text\n' "$APK_NAME" > README.md
          cat /tmp/janus-apk/oauth-build-info.txt >> README.md
          printf '\n```\n' >> README.md
          git add README.md "downloads/$APK_NAME" downloads/oauth-build-info.txt
          git commit -m "Publish JANUS Android native v$VERSION"
          git push --force origin HEAD:apk-download
