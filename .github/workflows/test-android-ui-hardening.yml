name: Test JANUS Android UI Hardening

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'tools/patch_android_*.py'
      - 'tests/test_android_ui_hardening.py'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/test-android-ui-hardening.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'tools/patch_android_*.py'
      - 'tests/test_android_ui_hardening.py'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/test-android-ui-hardening.yml'
  workflow_dispatch:

jobs:
  ui-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Verify UI hardening contracts
        run: python -m pytest -q tests/test_android_ui_hardening.py
      - name: Verify full Android product patch composition
        shell: bash
        run: |
          set -euxo pipefail
          python tools/patch_android_file_attachments.py
          python tools/patch_android_artifacts.py
          python tools/patch_android_artifact_export.py
          python tools/patch_android_research_workspace.py
          python tools/patch_android_maintenance_review.py
          python tools/patch_android_research_provenance.py
          python tools/patch_android_protocol_capabilities.py
          python tools/patch_android_ui_hardening.py
          python tools/patch_android_runtime_cores_v068.py
          grep -q 'id="themeMode"' android/app/src/main/assets/index.html
          grep -q 'id="themeAccent"' android/app/src/main/assets/index.html
          grep -q 'Compatibility' android/app/src/main/assets/index.html
          grep -q 'Background research' android/app/src/main/assets/index.html
          grep -q 'Maintenance review' android/app/src/main/assets/index.html
          grep -q 'Research workspace' android/app/src/main/assets/index.html
          grep -q 'Artifacts' android/app/src/main/assets/index.html
          grep -q 'pickAttachment' android/app/src/main/assets/index.html
          grep -q 'Download / Export' android/app/src/main/assets/index.html
          grep -q 'shareArtifactNative' android/app/src/main/assets/index.html
          grep -q 'fileprovider' android/app/src/main/AndroidManifest.xml
