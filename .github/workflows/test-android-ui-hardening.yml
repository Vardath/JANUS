name: Test JANUS Android UI Hardening

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'tests/test_android_ui_hardening.py'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/test-android-ui-hardening.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'tests/test_android_ui_hardening.py'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/test-android-ui-hardening.yml'
  workflow_dispatch:

jobs:
  ui-hardening:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install -q pytest
      - name: Verify native UI hardening contracts
        run: python -m pytest -q tests/test_android_ui_hardening.py
      - name: Verify authoritative native product surface
        shell: bash
        run: |
          set -euxo pipefail
          BASE=android/app/src/main/java/com/vardath/janus
          test ! -e android/app/src/main/assets/index.html
          test -s "$BASE/MainActivity.java"
          test -s "$BASE/JanusUiPolish.java"
          test -s "$BASE/JanusAdaptiveUi.java"
          test -s "$BASE/JanusChatHistoryStore.java"
          test -s "$BASE/JanusOfflineQueue.java"
          grep -q 'Research workspace' "$BASE/MainActivity.java"
          grep -q 'Artifacts' "$BASE/MainActivity.java"
          grep -q 'Maintenance review' "$BASE/MainActivity.java"
          grep -q 'Compatibility' "$BASE/MainActivity.java"
          grep -q 'WindowInsetsCompat.Type.systemBars()' "$BASE/JanusUiPolish.java"
          ! grep -R -q 'android.webkit.WebView\|JavascriptInterface' "$BASE"
