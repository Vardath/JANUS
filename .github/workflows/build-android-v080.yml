name: Build JANUS Android v0.80

on:
  push:
    branches: [main]
    paths:
      - 'android_v080/**'
      - 'android/app/src/main/assets/index.html'
      - '.github/workflows/build-android-v080.yml'
      - 'JANUS_ANDROID_V080_FEATURE_PARITY_AUDIT.md'
      - 'JANUS_ANDROID_V080_PRODUCT_REBUILD.md'
  workflow_dispatch:

jobs:
  android-v080:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify clean v0.80 client and original JANUS UI
        run: |
          set -euo pipefail
          SRC=android_v080/app/src/main/java/com/vardath/janus/v080/MainActivity.java
          UI=android/app/src/main/assets/index.html
          MAN=android_v080/app/src/main/AndroidManifest.xml
          GRADLE=android_v080/app/build.gradle
          test -s "$SRC" && test -s "$UI"
          ! grep -R "compose_android_phase3\|patch_android_" android_v080 .github/workflows/build-android-v080.yml
          grep -q "applicationId 'com.vardath.janus.v080'" "$GRADLE"
          grep -q "versionName '0.80-dev2'" "$GRADLE"
          grep -q "assets.srcDirs" "$GRADLE"
          test "$(grep -o 'android.intent.category.LAUNCHER' "$MAN" | wc -l)" -eq 1
          grep -q 'android:name=".MainActivity" android:label="JANUS" android:exported="true"' "$MAN"
          grep -q 'file:///android_asset/index.html' "$SRC"
          grep -q 'addJavascriptInterface(new Bridge(), "Android")' "$SRC"
          grep -q 'Sign in to continue your JANUS identity and memory.' "$UI"
          grep -q 'Username or email' "$UI"
          grep -q 'Message JANUS' "$UI"
          grep -q "\['chat','messages','observe','options'\]" "$UI"
          grep -q 'Research workspace' "$UI"
          grep -q 'Artifacts' "$UI"
          grep -q 'Maintenance review' "$UI"
          grep -q 'Background research' "$UI"
          grep -q 'Compatibility' "$UI"
          grep -q 'Settings' "$UI"

      - name: Verify account and server bridge
        run: |
          set -euo pipefail
          SRC=android_v080/app/src/main/java/com/vardath/janus/v080/MainActivity.java
          GOOGLE=android_v080/app/src/main/java/com/vardath/janus/v080/GoogleAuthActivity.java
          UI=android/app/src/main/assets/index.html
          grep -q '@JavascriptInterface public void request' "$SRC"
          grep -q 'Authorization' "$SRC"
          grep -q '/auth/login' "$SRC"
          grep -q '/auth/register' "$SRC"
          grep -q 'ACTION_OPEN_DOCUMENT' "$SRC"
          grep -q 'data_base64' "$SRC"
          grep -q '/desktop/chat' "$UI"
          grep -q '/desktop/messages?username=' "$UI"
          grep -q '/desktop/runtime-cores?username=' "$UI"
          grep -q '/files/upload' "$UI"
          grep -q 'client_message_id' "$UI"
          grep -q 'play-services-auth' android_v080/app/build.gradle
          grep -q 'requestIdToken(BuildConfig.GOOGLE_WEB_CLIENT_ID)' "$GOOGLE"
          grep -q '/auth/google' "$GOOGLE"
          grep -q 'code 10' "$GOOGLE"

      - name: Verify advanced activities remain available
        run: |
          set -euo pipefail
          test -s android_v080/app/src/main/java/com/vardath/janus/v080/ArtifactActivity.java
          test -s android_v080/app/src/main/java/com/vardath/janus/v080/ResearchActivity.java
          test -s android_v080/app/src/main/java/com/vardath/janus/v080/MaintenanceActivity.java
          test -s android_v080/app/src/main/java/com/vardath/janus/v080/SettingsActivity.java
          grep -q 'ArtifactActivity' android_v080/app/src/main/AndroidManifest.xml
          grep -q 'ResearchActivity' android_v080/app/src/main/AndroidManifest.xml
          grep -q 'MaintenanceActivity' android_v080/app/src/main/AndroidManifest.xml
          grep -q 'SettingsActivity' android_v080/app/src/main/AndroidManifest.xml

      - name: Build v0.80 dev2 APK
        working-directory: android_v080
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare unmistakable dev2 APK
        run: |
          set -euo pipefail
          test -s android_v080/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp android_v080/app/build/outputs/apk/debug/app-debug.apk dist/JANUS-Android-v0.80-dev2-ORIGINAL-UI.apk
          sha256sum dist/JANUS-Android-v0.80-dev2-ORIGINAL-UI.apk | tee dist/JANUS-Android-v0.80-dev2-ORIGINAL-UI.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: JANUS-Android-v0.80-dev2-ORIGINAL-UI
          path: |
            dist/JANUS-Android-v0.80-dev2-ORIGINAL-UI.apk
            dist/JANUS-Android-v0.80-dev2-ORIGINAL-UI.sha256
          if-no-files-found: error
