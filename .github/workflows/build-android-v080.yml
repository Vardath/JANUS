name: Build JANUS Android v0.80

on:
  push:
    branches: [main]
    paths:
      - 'android_v080/**'
      - '.github/workflows/build-android-v080.yml'
      - 'JANUS_ANDROID_V080_STAGE0_MAP.md'
      - 'JANUS_ANDROID_V080_FEATURE_PARITY_AUDIT.md'
  workflow_dispatch:

jobs:
  android-v080:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify clean-client boundary
        run: |
          set -euo pipefail
          SRC=android_v080/app/src/main/java/com/vardath/janus/v080/MainActivity.java
          test -d android_v080
          ! grep -R "compose_android_phase3\|patch_android_" android_v080 .github/workflows/build-android-v080.yml
          grep -q "applicationId 'com.vardath.janus.v080'" android_v080/app/build.gradle
          grep -q "versionName '0.80-dev1'" android_v080/app/build.gradle
          grep -q 'uses-permission android:name="android.permission.INTERNET"' android_v080/app/src/main/AndroidManifest.xml
          grep -q '7→2→1→1' "$SRC"
      - name: Verify single coherent launcher
        run: |
          set -euo pipefail
          HOME=android_v080/app/src/main/java/com/vardath/janus/v080/HomeActivity.java
          MAN=android_v080/app/src/main/AndroidManifest.xml
          test -s "$HOME"
          grep -q 'HomeActivity' "$MAN"
          test "$(grep -o 'android.intent.category.LAUNCHER' "$MAN" | wc -l)" -eq 1
          grep -q 'Chat · Messages · Observe · System' "$HOME"
          grep -q 'Research workspace' "$HOME"
          grep -q 'Artifacts · Open · Share · Export' "$HOME"
          grep -q 'Maintenance review' "$HOME"
          grep -q 'Themes · Background · Options' "$HOME"
          grep -q 'android:name=".MainActivity".*android:exported="false"' "$MAN"
          grep -q 'android:name=".ResearchActivity".*android:exported="false"' "$MAN"
          grep -q 'android:name=".ArtifactActivity".*android:exported="false"' "$MAN"
          grep -q 'android:name=".MaintenanceActivity".*android:exported="false"' "$MAN"
          grep -q 'android:name=".SettingsActivity".*android:exported="false"' "$MAN"
      - name: Verify core native feature contract
        run: |
          set -euo pipefail
          SRC=android_v080/app/src/main/java/com/vardath/janus/v080/MainActivity.java
          grep -q '"Chat","Messages","Observe","Options"' "$SRC"
          grep -q '/desktop/chat' "$SRC"
          grep -q '/desktop/messages?username=' "$SRC"
          grep -q '/desktop/runtime-cores' "$SRC"
          grep -q '/diagnostics/runtime-health' "$SRC"
          grep -q 'chat_queue' "$SRC"
          grep -q 'client_message_id' "$SRC"
          grep -q 'duplicate suppressed' "$SRC"
          grep -q 'Stable snapshot only' "$SRC"
          grep -q 'Healthy' "$SRC"
          grep -q 'Reduced capability' "$SRC"
          grep -q 'Needs attention' "$SRC"
          grep -q 'ACTION_OPEN_DOCUMENT' "$SRC"
          grep -q '/files/upload' "$SRC"
          grep -q 'MAX_ATTACHMENTS=4' "$SRC"
          grep -q 'attachment_ids' "$SRC"
          grep -q 'Grounded attachments' "$SRC"
          grep -q 'data_base64' "$SRC"
      - name: Verify native artifact export contract
        run: |
          set -euo pipefail
          ART=android_v080/app/src/main/java/com/vardath/janus/v080/ArtifactActivity.java
          MAN=android_v080/app/src/main/AndroidManifest.xml
          test -s "$ART"
          grep -q '/artifacts' "$ART"
          grep -q 'continuity_report' "$ART"
          grep -q 'research_digest' "$ART"
          grep -q 'working_note' "$ART"
          grep -q 'ACTION_VIEW' "$ART"
          grep -q 'ACTION_SEND' "$ART"
          grep -q 'FileProvider.getUriForFile' "$ART"
          grep -q 'ArtifactActivity' "$MAN"
          grep -q 'androidx.core.content.FileProvider' "$MAN"
          test -s android_v080/app/src/main/res/xml/file_paths.xml
      - name: Verify native research workspace contract
        run: |
          set -euo pipefail
          RES=android_v080/app/src/main/java/com/vardath/janus/v080/ResearchActivity.java
          MAN=android_v080/app/src/main/AndroidManifest.xml
          test -s "$RES"
          grep -q '/research-provenance/status?limit=20' "$RES"
          grep -q 'ESTABLISHED / RETRIEVED EVIDENCE' "$RES"
          grep -q 'PROVISIONAL HYPOTHESES' "$RES"
          grep -q 'NEGATIVE RESULTS' "$RES"
          grep -q 'OPEN QUESTIONS' "$RES"
          grep -q 'PROPOSED TESTS' "$RES"
          grep -q 'BACKGROUND RESEARCH / PROVENANCE' "$RES"
          grep -q 'research_digest' "$RES"
          grep -q 'ResearchActivity' "$MAN"
      - name: Verify maintenance themes and background controls
        run: |
          set -euo pipefail
          SET=android_v080/app/src/main/java/com/vardath/janus/v080/SettingsActivity.java
          THEME=android_v080/app/src/main/java/com/vardath/janus/v080/ThemePrefs.java
          MAINT=android_v080/app/src/main/java/com/vardath/janus/v080/MaintenanceActivity.java
          APP=android_v080/app/src/main/java/com/vardath/janus/v080/JanusApplication.java
          MAN=android_v080/app/src/main/AndroidManifest.xml
          test -s "$SET" && test -s "$THEME" && test -s "$MAINT" && test -s "$APP"
          grep -q 'system","light","dark' "$SET"
          grep -q 'indigo","teal","amber","violet","slate' "$SET"
          grep -q 'Background cycles:' "$SET"
          grep -q 'Observe telemetry:' "$SET"
          grep -q 'Local background interval' "$SET"
          grep -q '/maintenance/status' "$MAINT"
          grep -q 'approved_for_manual_work' "$MAINT"
          grep -q 'deferred' "$MAINT"
          grep -q 'rejected' "$MAINT"
          grep -q 'no automatic changes' "$MAINT"
          grep -q 'AppCompatDelegate.setDefaultNightMode' "$THEME"
          grep -q 'JanusApplication' "$MAN"
      - name: Verify parity audit exists
        run: |
          set -euo pipefail
          test -s JANUS_ANDROID_V080_FEATURE_PARITY_AUDIT.md
          grep -q 'Google sign-in parity remains to be reintroduced' JANUS_ANDROID_V080_FEATURE_PARITY_AUDIT.md
          grep -q 'Legacy retirement gate' JANUS_ANDROID_V080_FEATURE_PARITY_AUDIT.md
      - name: Build native v0.80 debug APK
        working-directory: android_v080
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify built APK
        run: |
          set -euo pipefail
          test -s android_v080/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android_v080/app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android_v080/app/build/outputs/apk/debug/app-debug.apk dist/JANUS-Android-v0.80-dev1.apk
          sha256sum dist/JANUS-Android-v0.80-dev1.apk | tee dist/JANUS-Android-v0.80-dev1.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: JANUS-Android-v0.80-dev1
          path: |
            dist/JANUS-Android-v0.80-dev1.apk
            dist/JANUS-Android-v0.80-dev1.sha256
          if-no-files-found: error
