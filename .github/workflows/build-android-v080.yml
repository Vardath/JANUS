name: Build JANUS Android v0.80

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'auth_rate_limit.py'
      - '.github/workflows/build-android-v080.yml'
  workflow_dispatch:

jobs:
  android-v080:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Verify authoritative original JANUS product
        shell: bash
        run: |
          set -euo pipefail
          UI=android/app/src/main/assets/index.html
          SRC=android/app/src/main/java/com/vardath/janus/MainActivity.java
          GRADLE=android/app/build.gradle
          MAN=android/app/src/main/AndroidManifest.xml
          test -s "$UI" && test -s "$SRC"
          grep -q "applicationId 'com.vardath.janus'" "$GRADLE"
          grep -q "versionName '0.80'" "$GRADLE"
          grep -q 'Sign in to continue your JANUS identity and memory.' "$UI"
          grep -q 'Username or email' "$UI"
          grep -q 'Create account' "$UI"
          grep -q 'Message JANUS' "$UI"
          grep -q "const main=\['chat','messages','observe','options'\]" "$UI"
          grep -q 'Research workspace' "$UI"
          grep -q 'Artifacts' "$UI"
          grep -q 'Maintenance review' "$UI"
          grep -q 'Background research' "$UI"
          grep -q 'Compatibility' "$UI"
          grep -q 'addJavascriptInterface(new Bridge(), "Android")' "$SRC"
          grep -q 'file:///android_asset/index.html' "$SRC"
          test "$(grep -o 'android.intent.category.LAUNCHER' "$MAN" | wc -l)" -eq 1

      - name: Verify restored auth compatibility
        shell: bash
        run: |
          set -euo pipefail
          grep -q '_normalize_legacy_android_request' auth_rate_limit.py
          grep -q 'data\["identifier"\] = data.pop("identity")' auth_rate_limit.py
          grep -q '_legacy_android_response' auth_rate_limit.py
          grep -q 'data.setdefault("profile_id", username)' auth_rate_limit.py

      - name: Validate Android UI JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('android/app/src/main/assets/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>', html, flags=re.I)
          if not scripts:
              raise SystemExit('No JANUS UI scripts found')
          out = Path('/tmp/janus-js')
          out.mkdir(exist_ok=True)
          for i, script in enumerate(scripts):
              (out / f'script-{i}.js').write_text(script, encoding='utf-8')
          PY
          for f in /tmp/janus-js/*.js; do node --check "$f"; done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Restore stable JANUS debug signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: janus-android-debug-keystore-v1

      - name: Ensure stable signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build authoritative JANUS v0.80 APK
        working-directory: android
        env:
          JANUS_GOOGLE_WEB_CLIENT_ID: ${{ secrets.JANUS_GOOGLE_WEB_CLIENT_ID }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug -PJANUS_GOOGLE_WEB_CLIENT_ID="$JANUS_GOOGLE_WEB_CLIENT_ID"

      - name: Prepare original-product APK and OAuth identity
        shell: bash
        run: |
          set -euo pipefail
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/JANUS-Android-v0.80-ORIGINAL-JANUS.apk
          {
            echo 'JANUS Android v0.80 build identity'
            echo 'Package: com.vardath.janus'
            echo "Source commit: $GITHUB_SHA"
            keytool -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android -keypass android | grep -E 'SHA1:|SHA256:' || true
          } > dist/oauth-build-info.txt
          sha256sum dist/JANUS-Android-v0.80-ORIGINAL-JANUS.apk > dist/JANUS-Android-v0.80-ORIGINAL-JANUS.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: JANUS-Android-v0.80-ORIGINAL-JANUS
          path: |
            dist/JANUS-Android-v0.80-ORIGINAL-JANUS.apk
            dist/JANUS-Android-v0.80-ORIGINAL-JANUS.sha256
            dist/oauth-build-info.txt
          if-no-files-found: error
