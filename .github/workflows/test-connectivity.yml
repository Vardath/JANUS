name: Test JANUS Global Connectivity

on:
  pull_request:
    paths:
      - 'core_sync.py'
      - 'tests/test_core_sync_presence.py'
      - '.github/workflows/test-connectivity.yml'
      - 'tools/patch_android_global_connectivity.py'
  push:
    branches: [main]
    paths:
      - 'core_sync.py'
      - 'tests/test_core_sync_presence.py'
      - '.github/workflows/test-connectivity.yml'
      - 'tools/patch_android_global_connectivity.py'
  workflow_dispatch:

jobs:
  connectivity-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Test authenticated presence and selective sync
        run: python -m pytest -q tests/test_core_sync_presence.py
