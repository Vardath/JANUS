name: Maintenance wire safe-area readability
on:
  push:
    branches: [android-v110-safearea-readability]
    paths: ['.github/workflows/maintenance-wire-safearea-readability.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: android-v110-safearea-readability
      - name: Patch MainActivity explicit owners
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/java/com/vardath/janus/MainActivity.java')
          s=p.read_text(encoding='utf-8')

          # Auth root opts directly into authored safe-area handling.
          anchor='root.setGravity(Gravity.CENTER_VERTICAL);\n        applyBackground(root);'
          repl='root.setGravity(Gravity.CENTER_VERTICAL);\n        applyBackground(root);\n        JanusSafeArea.install(root);'
          assert anchor in s
          s=s.replace(anchor,repl,1)

          # App root opts in directly, and top navigation becomes horizontally scrollable.
          old='root = vertical(); applyBackground(root); LinearLayout header = vertical();'
          new='root = vertical(); applyBackground(root); JanusSafeArea.install(root); LinearLayout header = vertical();'
          assert old in s
          s=s.replace(old,new,1)

          old_nav='nav = horizontal(); nav.setPadding(dp(6), dp(4), dp(6), dp(8)); for (String page : new String[]{"Chat", "Messages", "Observe", "Stream", "Options"}) { Button b = button(page); b.setTag(page); b.setOnClickListener(v -> showPage((String) v.getTag())); nav.addView(b, new LinearLayout.LayoutParams(0, dp(58), 1)); } root.addView(nav, full()); setContentView(root);'
          new_nav='nav = horizontal(); nav.setPadding(dp(6), dp(4), dp(6), dp(8)); for (String page : new String[]{"Chat", "Messages", "Observe", "Stream", "Options"}) { Button b = button(page); b.setTag(page); b.setMinWidth(dp(92)); b.setOnClickListener(v -> showPage((String) v.getTag())); nav.addView(b, new LinearLayout.LayoutParams(dp(92), dp(58))); } HorizontalScrollView navScroll = new HorizontalScrollView(this); navScroll.setHorizontalScrollBarEnabled(false); navScroll.setFillViewport(true); navScroll.addView(nav, new LinearLayout.LayoutParams(-2, dp(66))); root.addView(navScroll, full()); setContentView(root);'
          assert old_nav in s
          s=s.replace(old_nav,new_nav,1)

          old_options='text("Options · v1.10 (110)", 28, true)'
          assert old_options in s
          s=s.replace(old_options,'text(JanusBuildInfo.pageLabel("Options"), 28, true)',1)

          # Translate the stable top-level shell labels at ownership time without touching chat bodies.
          for label in ['Chat','Messages','Observe']:
              old=f'text("{label}", 28, true)'
              if old in s:
                  s=s.replace(old,f'text(JanusUiLocalizationPolish.shellText(this, "{label}"), 28, true)',1)

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/maintenance-wire-safearea-readability.yml
          git add android/app/src/main/java/com/vardath/janus/MainActivity.java
          git commit -m "Wire safe areas, dynamic build label and readable top navigation [skip ci]"
          git push origin HEAD:android-v110-safearea-readability
