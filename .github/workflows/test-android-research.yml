name: Test JANUS Android Research Workspace

on:
  push:
    branches: [main]
    paths:
      - 'research_workspace.py'
      - 'tools/patch_android_file_attachments.py'
      - 'tools/patch_android_artifacts.py'
      - 'tools/patch_android_research_workspace.py'
      - 'tools/patch_android_runtime_cores_v068.py'
      - 'tests/test_android_research_workspace.py'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/test-android-research.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-productization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: pip install pytest
      - name: Verify Android research integration contract
        run: python -m pytest -q tests/test_android_research_workspace.py
      - name: Verify product patches compose against clean Android base
        run: |
          python tools/patch_android_file_attachments.py
          python tools/patch_android_artifacts.py
          python tools/patch_android_research_workspace.py
          python tools/patch_android_runtime_cores_v068.py
          grep -q 'Research workspace' android/app/src/main/assets/index.html
          grep -q 'refreshResearchWorkspace' android/app/src/main/assets/index.html
          grep -q 'Retained negative result' android/app/src/main/assets/index.html
          grep -q 'System status' android/app/src/main/assets/index.html
