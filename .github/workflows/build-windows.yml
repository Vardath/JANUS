name: Build JANUS Windows Client

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build JANUS.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name JANUS client/janus_client_v015.py
          Copy-Item client/JANUS.bat dist/JANUS.bat
          Set-Content -Path dist/README.txt -Value "JANUS Windows Client v0.16`r`n`r`n1. Double-click JANUS.bat or JANUS.exe.`r`n2. Chat remains one running conversation.`r`n3. User messages appear on the right; JANUS messages appear on the left.`r`n4. The message input box is pinned to the bottom and always visible.`r`n5. Enter sends; Shift+Enter adds a new line.`r`n6. Use Chat, Observe, Cores, Memory, Activity and Settings from the left navigation.`r`n`r`nServer: https://janus-global-core.onrender.com"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: JANUS-Windows-v0.16
          path: |
            dist/JANUS.exe
            dist/JANUS.bat
            dist/README.txt
          if-no-files-found: error
