name: Build JANUS Windows Client

on:
  push:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller
      - name: Syntax-check Windows client chain
        shell: pwsh
        run: |
          python -m py_compile client/janus_local_society.py client/janus_client_v020.py client/janus_client_v021.py client/janus_client_v022.py client/janus_client_v023.py client/janus_client_v024.py
      - name: Verify local and global 1-3-7 contracts
        shell: pwsh
        run: |
          $local = Get-Content client/janus_local_society.py -Raw
          $client = Get-Content client/janus_client_v024.py -Raw
          if ($local -notmatch 'CORE_NAMES = \(\*SPECIALISTS, \*HEMISPHERES, "front", "interface"\)') { exit 1 }
          if ($local -notmatch '"evidence": 1' -or $local -notmatch '"memory": 7') { exit 1 }
          if ($local -notmatch '"left_hemisphere", "right_hemisphere"') { exit 1 }
          if ($local -notmatch 'def ingest_peer') { exit 1 }
          if ($local -notmatch 'background_external_api_calls": 0') { exit 1 }
          if ($client -notmatch 'Local \+ Global 1\|3\|7') { exit 1 }
          if ($client -notmatch 'LocalJanusSociety') { exit 1 }
          if ($client -notmatch 'front_appraisal') { exit 1 }
          if ($client -notmatch 'server.get\("front"\).*server.get\("consensus"\)') { exit 1 }
          python -c "import sys,tempfile,os; sys.path.insert(0,'client'); from janus_local_society import LocalJanusSociety,CORE_NAMES; p=os.path.join(tempfile.mkdtemp(),'state.json'); s=LocalJanusSociety(p); x=s.sense('text','test','new useful idea but possible risk',salience=.8,uncertainty=.2,novelty=.7); assert len(CORE_NAMES)==11; assert x['core_count']==11; assert set(x['cycles'])==set(CORE_NAMES); assert x['background_external_api_calls']==0; y=s.ingest_peer({'front':'global result','front_appraisal':{'salience':.6,'uncertainty':.3,'novelty':.4}}); assert y['cycles']['evidence']>x['cycles']['evidence']; print('Windows local society contract passed')"
      - name: Build JANUS.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --paths client --name JANUS client/janus_client_v024.py
          Copy-Item client/JANUS.bat dist/JANUS.bat
          Set-Content -Path dist/README.txt -Value "JANUS Windows Client v0.25`r`n`r`nAuthenticated desktop client with a persistent deterministic local 11-core JANUS society plus the independent global 11-core society.`r`nLocal text/file/runtime/peer senses pass through all seven Fano subconscious cores, both hemispheres, Front appraisal and Interface with zero local background model/API calls.`r`nThe client sends a bounded local snapshot every 30 seconds; global state returns as a peer sense through all seven local cores and never overwrites local state.`r`n`r`nConceptual architecture per society: 1|3|7.`r`nMechanical flow: 7 -> 2 -> 1 -> 1.`r`nLocal + Global when connected: 22 distinct cores.`r`nLegacy Consensus is transport compatibility only; Front is canonical.`r`nServer: https://janus-global-core.onrender.com"
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: JANUS-Windows-v0.25
          path: |
            dist/JANUS.exe
            dist/JANUS.bat
            dist/README.txt
          if-no-files-found: error
