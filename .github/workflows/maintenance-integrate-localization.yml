name: Maintenance integrate explicit localization
on:
  push:
    branches: [android-v110-explicit-localization]
    paths: ['.github/workflows/maintenance-integrate-localization.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: android-v110-explicit-localization
      - name: Patch owned control creation and Settings language card
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/com/vardath/janus/MainActivity.java')
          s = p.read_text(encoding='utf-8')

          old_settings = 'list.addView(theme,full()); LinearLayout runtime=card();'
          new_settings = 'list.addView(theme,full()); JanusLanguagePolish.renderSettingsCard(this,list); LinearLayout runtime=card();'
          assert old_settings in s, 'Settings insertion anchor changed unexpectedly'
          s = s.replace(old_settings, new_settings, 1)

          old_input = 'private EditText input(String hint){EditText e=new EditText(this);e.setHint(hint);e.setHintTextColor(mutedColor());e.setTextColor(textColor());e.setSingleLine(true);e.setPadding(dp(12),dp(9),dp(12),dp(9));return e;}'
          new_input = 'private EditText input(String hint){EditText e=new EditText(this);JanusUiLocalizationPolish.applyHint(this,e,hint);e.setHintTextColor(mutedColor());e.setTextColor(textColor());e.setSingleLine(true);e.setPadding(dp(12),dp(9),dp(12),dp(9));return e;}'
          assert old_input in s, 'input helper changed unexpectedly'
          s = s.replace(old_input, new_input, 1)

          old_button = 'private Button button(String s){Button b=new Button(this);b.setText(s);b.setAllCaps(false);return b;}'
          new_button = 'private Button button(String s){Button b=new Button(this);JanusUiLocalizationPolish.applyButton(this,b,s);b.setAllCaps(false);return b;}'
          assert old_button in s, 'button helper changed unexpectedly'
          s = s.replace(old_button, new_button, 1)

          p.write_text(s, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/maintenance-integrate-localization.yml
          git add android/app/src/main/java/com/vardath/janus/MainActivity.java
          git commit -m "Wire explicit localization into owned controls [skip ci]"
          git push origin HEAD:android-v110-explicit-localization
