name: Maintenance wire v1.11 theme and human logs
on:
  push:
    branches: [android-v111-theme-human-logs]
    paths: ['.github/workflows/maintenance-v111-theme-human-logs.yml']
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: android-v111-theme-human-logs
      - name: Patch MainActivity and version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/java/com/vardath/janus/MainActivity.java')
          s=p.read_text(encoding='utf-8')

          # Observe filter previously appended a complete Observe screen each tap.
          old='b.setOnClickListener(v -> { observeMode = mode; showObserve(); });'
          assert old in s
          s=s.replace(old,'b.setOnClickListener(v -> { observeMode = mode; showPage("Observe"); });',1)

          # Selected top-level page carries the app-local accent; unselected tabs remain neutral/readable.
          old='b.setTypeface(Typeface.DEFAULT, selected ? Typeface.BOLD : Typeface.NORMAL); b.setAlpha(selected ? 1f : .62f);'
          assert old in s
          s=s.replace(old,'b.setTypeface(Typeface.DEFAULT, selected ? Typeface.BOLD : Typeface.NORMAL); b.setAlpha(1f); if (selected) JanusTheme.applyAccentButton(this, b); else JanusTheme.applyButton(this, b);',1)

          # Runtime output: readable summary first; exact machine text behind Technical details.
          old='String out = c.optString("last_output", ""); if (!out.isBlank()) card.addView(text(out, 14, false));'
          assert old in s
          new='String out = c.optString("last_output", ""); if (!out.isBlank()) { card.addView(text(JanusHumanText.summarize(out), 14, false)); Button tech = button("Technical details"); final String rawOut = out; tech.setOnClickListener(v -> new AlertDialog.Builder(this).setTitle(prettyName(name)).setMessage(rawOut).setPositiveButton("Close", null).show()); card.addView(tech, wrap()); }'
          s=s.replace(old,new,1)

          # Local continuity: cards with compact summary and opt-in raw detail instead of dense machine strings.
          old='for (int i = lf.length()-1; i >= 0 && i >= lf.length()-40; i--) list.addView(text(lf.optString(i), 14, false), full());'
          assert old in s
          new='for (int i = lf.length()-1; i >= 0 && i >= lf.length()-40; i--) { String rawMemory = lf.optString(i); LinearLayout mc = card(); mc.addView(text(JanusHumanText.memoryTitle(rawMemory), 14, true)); mc.addView(text(JanusHumanText.summarize(rawMemory), 14, false)); Button tech = button("Technical details"); tech.setOnClickListener(v -> new AlertDialog.Builder(this).setTitle(JanusHumanText.memoryTitle(rawMemory)).setMessage(rawMemory).setPositiveButton("Close", null).show()); mc.addView(tech, wrap()); list.addView(mc, full()); }'
          s=s.replace(old,new,1)

          # MainActivity helpers now all read from one app-local palette.
          start=s.index('    private LinearLayout vertical(){')
          end=s.index('    private void toast(String s)', start)
          replacement='''    private LinearLayout vertical(){LinearLayout l=new LinearLayout(this);l.setOrientation(LinearLayout.VERTICAL);applyBackground(l);return l;}\n    private LinearLayout horizontal(){LinearLayout l=new LinearLayout(this);l.setOrientation(LinearLayout.HORIZONTAL);return l;}\n    private LinearLayout card(){LinearLayout l=vertical();l.setPadding(dp(12),dp(10),dp(12),dp(10));JanusTheme.applyCard(this,l);LinearLayout.LayoutParams lp=full();lp.setMargins(0,dp(5),0,dp(5));l.setLayoutParams(lp);return l;}\n    private TextView text(String s,int sp,boolean bold){TextView t=new TextView(this);t.setText(s);t.setTextSize(sp);JanusTheme.applyText(this,t,false);t.setPadding(dp(5),dp(7),dp(5),dp(7));if(bold)t.setTypeface(Typeface.DEFAULT,Typeface.BOLD);return t;}\n    private EditText input(String hint){EditText e=new EditText(this);JanusUiLocalizationPolish.applyHint(this,e,hint);JanusTheme.applyInput(this,e);e.setSingleLine(true);e.setPadding(dp(12),dp(9),dp(12),dp(9));return e;}\n    private Button button(String s){Button b=new Button(this);JanusUiLocalizationPolish.applyButton(this,b,s);b.setAllCaps(false);JanusTheme.applyButton(this,b);return b;}\n    private void applyBackground(View v){JanusTheme.applyRoot(this,v);}\n    private int backgroundColor(){return JanusTheme.background(this);}\n    private int surfaceColor(){return JanusTheme.surface(this);}\n    private int textColor(){return JanusTheme.text(this);}\n    private int mutedColor(){return JanusTheme.muted(this);}\n    private int userColor(){return JanusTheme.userBubble(this);}\n    private boolean isDark(){return JanusTheme.dark(this);}\n    private int accentColor(){return JanusTheme.accent(this);}\n'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s,encoding='utf-8')

          g=Path('android/app/build.gradle')
          x=g.read_text(encoding='utf-8')
          assert "versionCode 110" in x and "versionName '1.10'" in x
          x=x.replace('versionCode 110','versionCode 111',1).replace("versionName '1.10'","versionName '1.11'",1)
          g.write_text(x,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/maintenance-v111-theme-human-logs.yml
          git add android/app/src/main/java/com/vardath/janus/MainActivity.java android/app/build.gradle
          git commit -m "Wire app-local themes and human-readable runtime views [skip ci]"
          git push origin HEAD:android-v111-theme-human-logs
