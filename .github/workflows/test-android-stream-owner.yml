name: Test JANUS Android Stream Owner
on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/test-android-stream-owner.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/test-android-stream-owner.yml'
jobs:
  stream-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify explicit Stream renderer boundary
        shell: bash
        run: |
          set -euxo pipefail
          STREAM=android/app/src/main/java/com/vardath/janus/JanusStreamScreen.java
          test -s "$STREAM"
          grep -q 'public interface Host' "$STREAM"
          grep -q 'public static void render(Host host, LinearLayout content)' "$STREAM"
          grep -q '/desktop/stream-observe?limit=160' "$STREAM"
          grep -q 'localRecursiveSnapshot' "$STREAM"
          grep -q 'Hidden chain-of-thought is never exposed' "$STREAM"
          ! grep -q 'getDeclaredField\|getDeclaredMethod\|java.lang.reflect' "$STREAM"
          ! grep -q 'findViewById\|findButton\|OnGlobalLayoutListener\|postDelayed' "$STREAM"
          ! grep -q 'JanusStreamObservePolish.install' android/app/src/main/java/com/vardath/janus/JanusApplication.java
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: '8.11.1' }
      - name: Ensure debug signing key exists
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"; fi
      - name: Compile explicit Stream owner
        working-directory: android
        env: { JANUS_GOOGLE_WEB_CLIENT_ID: '${{ secrets.JANUS_GOOGLE_WEB_CLIENT_ID }}' }
        run: gradle --no-daemon :app:compileDebugJavaWithJavac --stacktrace -PJANUS_GOOGLE_WEB_CLIENT_ID="$JANUS_GOOGLE_WEB_CLIENT_ID"
