name: Test JANUS Android Maintenance Review

on:
  push:
    branches: [main]
    paths:
      - 'maintenance_owner_api.py'
      - 'maintenance_review.py'
      - 'tools/patch_maintenance_owner_api.py'
      - 'tests/test_android_maintenance_review.py'
      - 'android/**'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/test-android-maintenance.yml'
      - 'Dockerfile'
  pull_request:
    paths:
      - 'maintenance_owner_api.py'
      - 'maintenance_review.py'
      - 'tools/patch_maintenance_owner_api.py'
      - 'tests/test_android_maintenance_review.py'
      - 'android/**'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/test-android-maintenance.yml'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  maintenance-productization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Verify maintenance integration contract
        run: python -m pytest -q tests/test_android_maintenance_review.py
      - name: Verify native Android maintenance surface
        shell: bash
        run: |
          set -euxo pipefail
          MAIN=android/app/src/main/java/com/vardath/janus/MainActivity.java
          test -s "$MAIN"
          test ! -e android/app/src/main/assets/index.html
          grep -q 'Maintenance Review' "$MAIN"
          grep -q 'Research workspace' "$MAIN"
          grep -q '/maintenance/status' "$MAIN"
          grep -q 'approved_for_manual_work' "$MAIN"
          grep -q 'No automatic changes will be made.' "$MAIN"
          grep -q 'It never authorizes JANUS to edit code, install packages, change models/APIs or deploy itself.' "$MAIN"
      - name: Verify bootstrap maintenance API patch composes
        run: |
          python tools/patch_maintenance_owner_api.py
          grep -q 'maintenance_owner_router' bootstrap.py
          grep -q 'APIRouter(prefix="/maintenance"' maintenance_owner_api.py
          grep -q '@router.get("/status")' maintenance_owner_api.py
          grep -q '@router.post("/reviews/{review_id}/decision")' maintenance_owner_api.py
