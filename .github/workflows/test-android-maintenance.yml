name: Test JANUS Android Maintenance Review

on:
  push:
    branches: [main]
    paths:
      - 'maintenance_owner_api.py'
      - 'maintenance_review.py'
      - 'tools/patch_maintenance_owner_api.py'
      - 'tools/patch_android_maintenance_review.py'
      - 'tools/patch_android_research_workspace.py'
      - 'tools/patch_android_artifacts.py'
      - 'tools/patch_android_file_attachments.py'
      - 'tests/test_android_maintenance_review.py'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/test-android-maintenance.yml'
      - 'Dockerfile'
  pull_request:
    paths:
      - 'maintenance_owner_api.py'
      - 'maintenance_review.py'
      - 'tools/patch_maintenance_owner_api.py'
      - 'tools/patch_android_maintenance_review.py'
      - 'tests/test_android_maintenance_review.py'
      - '.github/workflows/build-android.yml'
      - 'Dockerfile'
  workflow_dispatch:

jobs:
  maintenance-productization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Verify maintenance integration contract
        run: python -m pytest -q tests/test_android_maintenance_review.py
      - name: Verify Android product patches compose
        run: |
          python tools/patch_android_file_attachments.py
          python tools/patch_android_artifacts.py
          python tools/patch_android_research_workspace.py
          python tools/patch_android_maintenance_review.py
          grep -q 'Maintenance review' android/app/src/main/assets/index.html
          grep -q 'Research workspace' android/app/src/main/assets/index.html
          grep -q 'attachmentPicker' android/app/src/main/assets/index.html
      - name: Verify bootstrap maintenance API patch composes
        run: |
          python tools/patch_maintenance_owner_api.py
          grep -q 'maintenance_owner_router' bootstrap.py
          grep -q '/maintenance/status' maintenance_owner_api.py
