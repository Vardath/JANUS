name: Kick JANUS Android Build

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Android build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-android.yml --repo "${{ github.repository }}" --ref main
