name: Test JANUS Android Artifacts

on:
  push:
    branches: [main]
    paths:
      - 'outbound_artifacts.py'
      - 'tools/patch_android_artifacts.py'
      - 'tools/patch_android_file_attachments.py'
      - 'tools/patch_android_runtime_cores_v068.py'
      - 'tests/test_android_artifact_productization.py'
      - '.github/workflows/build-android.yml'
      - '.github/workflows/test-android-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-productization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependency
        run: pip install pytest
      - name: Verify Android artifact integration contract
        run: python -m pytest -q tests/test_android_artifact_productization.py
      - name: Verify product patches compose against clean Android base
        run: |
          python tools/patch_android_file_attachments.py
          python tools/patch_android_artifacts.py
          python tools/patch_android_runtime_cores_v068.py
          grep -q 'id="artifacts"' android/app/src/main/assets/index.html
          grep -q 'refreshArtifacts' android/app/src/main/assets/index.html
          grep -q 'attachmentStrip' android/app/src/main/assets/index.html
