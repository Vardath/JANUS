name: Smoke test live JANUS server v2

on:
  push:
    branches: [main]
    paths:
      - 'render.yaml'
      - '.github/workflows/live-server-v2-smoke.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install smoke-test client
        run: pip install requests
      - name: Exercise deployed v2 service and record result
        shell: bash
        run: |
          set +e
          python - <<'PY' > /tmp/live-smoke.log 2>&1
          import base64, json, random, string, time
          import requests

          BASE='https://janus-global-core.onrender.com'
          report=[]
          failures=[]
          def note(name, ok, detail=''):
              report.append({'test':name,'ok':bool(ok),'detail':str(detail)[:1200]})
              if not ok: failures.append(name)
          def get(path, **kw): return requests.get(BASE+path, timeout=90, **kw)
          def post(path, **kw): return requests.post(BASE+path, timeout=180, **kw)

          # Render may still be deploying the cutover commit. Wait specifically for v2.
          ready=False
          last=''
          for _ in range(48):
              try:
                  h=get('/health')
                  c=get('/protocol/capabilities')
                  last=f'health={h.status_code} caps={c.status_code} {c.text[:300]}'
                  if h.status_code==200 and c.status_code==200 and c.json().get('server_generation')=='v2-clean-reconstruction':
                      ready=True; break
              except Exception as e:
                  last=repr(e)
              time.sleep(10)
          note('v2 deployed and reachable', ready, last)
          if not ready:
              print(json.dumps({'report':report,'failures':failures},indent=2)); raise SystemExit(1)

          h=get('/health'); hj=h.json()
          note('health', h.status_code==200 and hj.get('status')=='ok' and hj.get('core_count')==11, hj)
          c=get('/protocol/capabilities'); cj=c.json()
          required=['chat','messages','observe','memory','local_global_sync','attachments','visual_analysis','foreground_web','research_workspace','artifacts','image_generation','maintenance']
          note('capability contract', c.status_code==200 and all(cj.get('features',{}).get(k) is True for k in required), cj)

          suffix=''.join(random.choice(string.ascii_lowercase+string.digits) for _ in range(10))
          username='ci-'+suffix
          email=username+'@example.invalid'
          password='JANUS-CI-'+suffix+'-A7z9'
          r=post('/auth/register',json={'username':username,'email':email,'password':password})
          note('register', r.status_code==200, r.text)
          if r.status_code!=200:
              print(json.dumps({'report':report,'failures':failures},indent=2)); raise SystemExit(1)
          token=r.json().get('access_token','')
          headers={'Authorization':'Bearer '+token}

          try:
              me=get('/auth/me',headers=headers)
              note('session auth', me.status_code==200 and me.json().get('account',{}).get('username')==username, me.text)

              sync=post('/core-sync/exchange',headers=headers,json={'device_id':'ci-live-device','client_version':'v0.82','phase':'wake','consensus':'client feedback','interface':'client interface','observe_events':[{'detail':'live smoke feedback'}]})
              sj=sync.json() if sync.status_code==200 else {}
              note('selective federation', sync.status_code==200 and sj.get('guidance',{}).get('sync_policy')=='selective-no-overwrite' and sj.get('server',{}).get('architecture')=='7->2->1->1', sync.text)

              chat=post('/desktop/chat',headers=headers,json={'message':'Reply briefly to this greeting: hello JANUS','client_message_id':'live-basic-1'})
              ch=chat.json() if chat.status_code==200 else {}
              reply=str(ch.get('reply',''))
              exact_route=['evidence','logic','counterpoint','context','memory','safety','novelty','left_hemisphere','right_hemisphere','consensus','interface']
              model_ok=reply and 'failed this turn' not in reply.lower() and 'not configured' not in reply.lower() and 'budget has been reached' not in reply.lower()
              note('live 11-core model chat', chat.status_code==200 and ch.get('route_trace')==exact_route and model_ok, {'status':chat.status_code,'reply':reply[:500],'model_policy':ch.get('model_policy')})

              current=post('/desktop/chat',headers=headers,json={'message':'Search the current web and tell me in one sentence whether the OpenAI API currently has GPT-5.6 Luna.','client_message_id':'live-web-1'})
              cur=current.json() if current.status_code==200 else {}
              note('live foreground web research', current.status_code==200 and bool(cur.get('web') or cur.get('research_grounding')) and bool(cur.get('reply')), {'status':current.status_code,'web':cur.get('web'),'sources':cur.get('sources'),'reply':str(cur.get('reply',''))[:500]})

              data=base64.b64encode(b'JANUS clean v2 file grounding live smoke evidence.').decode()
              up=post('/files/upload',headers=headers,json={'filename':'live-smoke.txt','mime_type':'text/plain','data_base64':data})
              fid=(up.json().get('file') or {}).get('id') if up.status_code==200 else None
              note('file upload', up.status_code==200 and bool(fid), up.text)
              if fid:
                  grounded=post('/desktop/chat',headers=headers,json={'message':'Summarize the attached smoke-test evidence.','attachment_ids':[fid],'client_message_id':'live-file-1'})
                  gj=grounded.json() if grounded.status_code==200 else {}
                  note('file grounding through specialists', grounded.status_code==200 and gj.get('attachment_grounding') is True, grounded.text[:1200])

              runtime=get('/desktop/runtime-cores?username=forged',headers=headers)
              rt=(runtime.json().get('runtime') or {}) if runtime.status_code==200 else {}
              note('private persistent 11-core runtime', runtime.status_code==200 and rt.get('core_count')==11 and rt.get('registered_clients',0)>=1 and len(rt.get('core_reliability') or [])==11, {'status':runtime.status_code,'core_count':rt.get('core_count'),'registered_clients':rt.get('registered_clients')})

              seed=post('/research/workspace/seed',headers=headers,json={})
              ws=get('/research/workspace',headers=headers)
              note('research workspace', seed.status_code==200 and ws.status_code==200 and (ws.json().get('count') or 0)>=3, {'seed':seed.text[:300],'workspace':ws.text[:600]})

              art=post('/artifacts',headers=headers,json={'kind':'working_note'})
              aj=(art.json().get('artifact') or {}) if art.status_code==200 else {}
              aid=aj.get('id')
              info=get('/artifacts/'+str(aid),headers=headers) if aid else None
              note('artifact creation', art.status_code==200 and aid and info is not None and info.status_code==200, {'create':art.text[:500],'get':info.text[:500] if info is not None else ''})

              maint=get('/maintenance/status',headers=headers)
              note('maintenance surface', maint.status_code==200, maint.text[:800])

              # One explicit image request verifies the actual configured image model/quality.
              img=post('/images/generate',headers=headers,json={'prompt':'A simple clean diagram: one circle labelled JANUS on a plain background.'})
              ij=img.json() if img.status_code==200 else {}
              generated=ij.get('generated_image') or ij.get('image') or {}
              iid=generated.get('id')
              inline=get('/images/'+str(iid)+'/inline',headers=headers) if iid else None
              note('live image generation medium pipeline', img.status_code==200 and iid and inline is not None and inline.status_code==200 and bool(inline.json().get('data_base64')), {'generate_status':img.status_code,'inline_status':inline.status_code if inline is not None else None,'quality':generated.get('quality')})

              obs=get('/desktop/core-observe?limit=250',headers=headers)
              items=obs.json().get('items',[]) if obs.status_code==200 else []
              names={x.get('core_name') for x in items}
              note('observe covers all 11 cores', obs.status_code==200 and set(exact_route).issubset(names), {'cores':sorted(x for x in names if x)})
          finally:
              dele=requests.delete(BASE+'/auth/account',headers=headers,json={'confirmation':'DELETE','current_password':password},timeout=90)
              note('smoke account cleanup', dele.status_code==200, dele.text)

          print(json.dumps({'report':report,'failures':failures},indent=2))
          raise SystemExit(1 if failures else 0)
          PY
          STATUS=$?
          mkdir -p docs
          {
            echo "JANUS SERVER V2 LIVE SMOKE"
            echo "trigger_sha=${GITHUB_SHA}"
            echo "exit=${STATUS}"
            echo
            cat /tmp/live-smoke.log
          } > docs/SERVER_V2_LIVE_SMOKE.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/SERVER_V2_LIVE_SMOKE.txt
          git commit -m "Record JANUS server v2 live smoke result" || true
          git push || true
          exit "$STATUS"
