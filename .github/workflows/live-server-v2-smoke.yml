name: Smoke test live JANUS Android/server path

on:
  push:
    branches: [main]
    paths:
      - 'server_v2/**'
      - 'render.yaml'
      - 'requirements.txt'
      - '.github/workflows/live-server-v2-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: janus-live-server-smoke
  cancel-in-progress: true

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install smoke-test client
        run: pip install requests
      - name: Wait for Render and exercise the Android-critical path
        shell: bash
        run: |
          python - <<'PY'
          import json, random, string, time
          import requests

          BASE='https://janus-global-core.onrender.com'
          session=requests.Session()

          def get(path, **kw):
              return session.get(BASE+path, timeout=60, **kw)
          def post(path, **kw):
              return session.post(BASE+path, timeout=120, **kw)

          # Render may still be deploying when a main commit triggers this workflow.
          last='not attempted'
          healthy=False
          for attempt in range(90):
              try:
                  h=get('/health')
                  c=get('/protocol/capabilities')
                  if h.status_code==200 and c.status_code==200:
                      hj=h.json(); cj=c.json()
                      if (cj.get('server_generation')=='v2-clean-reconstruction'
                          and (cj.get('cognitive_engine_generation') or hj.get('cognitive_engine_generation'))=='recursive-conscious-stream-v2'):
                          healthy=True
                          break
                      last=f'generation mismatch health={hj} capabilities={cj}'
                  else:
                      last=f'health={h.status_code} capabilities={c.status_code}'
              except Exception as exc:
                  last=repr(exc)
              time.sleep(10)
          if not healthy:
              raise SystemExit('Render did not become healthy/current within wait window: '+last)

          hj=get('/health').json(); cj=get('/protocol/capabilities').json()
          assert hj.get('status')=='ok', hj
          assert int(hj.get('core_count') or 0)==11, hj
          assert cj.get('server_generation')=='v2-clean-reconstruction', cj
          assert (cj.get('cognitive_engine_generation') or hj.get('cognitive_engine_generation'))=='recursive-conscious-stream-v2', (hj,cj)

          suffix=''.join(random.choice(string.ascii_lowercase+string.digits) for _ in range(10))
          username='ci-live-'+suffix
          password='JANUS-CI-'+suffix+'-A7z9!'
          reg=post('/auth/register',json={'username':username,'email':username+'@example.invalid','password':password})
          assert reg.status_code==200, reg.text
          token=reg.json().get('access_token') or ''
          assert token, reg.text
          headers={'Authorization':'Bearer '+token}

          try:
              me=get('/auth/me',headers=headers)
              assert me.status_code==200, me.text

              chat=post('/desktop/chat',headers=headers,json={
                  'message':'Reply with a brief greeting so this release smoke test can verify JANUS chat.',
                  'client_message_id':'live-release-'+suffix,
              })
              assert chat.status_code==200, chat.text
              body=chat.json(); reply=str(body.get('reply') or '').strip()
              assert reply, body
              assert 'temporarily unavailable' not in reply.lower(), reply

              sync=post('/core-sync/exchange',headers=headers,json={
                  'device_id':'ci-live-android',
                  'client_version':'1.08',
                  'phase':'wake',
                  'front':'live smoke front state',
                  'interface':'live smoke interface state',
              })
              assert sync.status_code==200, sync.text

              stream=get('/desktop/stream-observe?limit=20',headers=headers)
              assert stream.status_code==200, stream.text

              maint=get('/maintenance/status',headers=headers)
              assert maint.status_code==200, maint.text

              print(json.dumps({
                  'ok':True,
                  'health':hj,
                  'server_generation':cj.get('server_generation'),
                  'cognitive_engine_generation':cj.get('cognitive_engine_generation') or hj.get('cognitive_engine_generation'),
                  'chat_reply_preview':reply[:180],
                  'sync_status':sync.status_code,
                  'stream_status':stream.status_code,
                  'maintenance_status':maint.status_code,
              },indent=2))
          finally:
              try:
                  session.delete(BASE+'/auth/account',headers=headers,json={
                      'confirmation':'DELETE','current_password':password
                  },timeout=60)
              except Exception:
                  pass
          PY
