name: Test JANUS Curiosity Search

on:
  push:
    branches: [main]
    paths:
      - 'curiosity_search.py'
      - 'epistemic_search_bridge.py'
      - 'self_assessment.py'
      - 'janus_dashboard.py'
      - 'interface_chat.py'
      - 'deliberation_tasks.py'
      - 'continuity_ledger.py'
      - 'continuity_governance.py'
      - 'continuity_api.py'
      - 'research_workspace.py'
      - 'reliability_audit.py'
      - 'persistence_matrix.py'
      - 'auth_schema_guard.py'
      - 'core_sync.py'
      - 'federated_sync.py'
      - 'cost_governor.py'
      - 'cost_governor_hooks.py'
      - 'maintenance_review.py'
      - 'proactive_threads.py'
      - 'attachment_api.py'
      - 'outbound_artifacts.py'
      - 'bootstrap.py'
      - 'secure_desktop.py'
      - 'image_response_compat.py'
      - 'image_generation.py'
      - 'visual_explanation.py'
      - 'visual_deliberation.py'
      - 'vision_analysis.py'
      - 'autonomous_messages.py'
      - 'proactive_quality.py'
      - 'background_cognition.py'
      - 'background_usefulness.py'
      - 'memory_quality.py'
      - 'tests/test_epistemic_regulation.py'
      - 'tests/test_proactive_quality.py'
      - 'tests/test_background_cognition.py'
      - 'tests/test_background_usefulness.py'
      - 'tests/test_memory_quality.py'
      - 'tests/test_continuity_ledger.py'
      - 'tests/test_continuity_governance.py'
      - 'tests/test_research_workspace.py'
      - 'tests/test_reliability_audit.py'
      - 'tests/test_persistence_matrix.py'
      - 'tests/test_profile_boundary_hardening.py'
      - 'tests/test_federated_sync.py'
      - 'tests/test_cost_governor.py'
      - 'tests/test_maintenance_review.py'
      - 'tests/test_proactive_threads.py'
      - 'tests/test_outbound_artifacts.py'
      - 'tests/test_visual_explanation.py'
      - 'tests/test_visual_deliberation.py'
      - 'tools/rebuild_server.py'
      - 'src/server.py.gz.b64.*'
      - 'render.yaml'
      - '.env.example'
      - '.github/workflows/test-curiosity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-curiosity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install application and test dependencies
        run: pip install -r requirements.txt pytest
      - name: Reconstruct legacy base server
        run: python tools/rebuild_server.py
      - name: Compile cognition, usefulness, memory, continuity, research, reliability, persistence, security, sync, cost, maintenance, threads, artifacts and visual policy
        run: python -m py_compile server.py curiosity_search.py epistemic_search_bridge.py self_assessment.py proactive_quality.py background_cognition.py background_usefulness.py memory_quality.py autonomous_messages.py proactive_threads.py continuity_ledger.py continuity_governance.py continuity_api.py research_workspace.py reliability_audit.py persistence_matrix.py auth_schema_guard.py federated_sync.py core_sync.py cost_governor.py cost_governor_hooks.py maintenance_review.py attachment_api.py outbound_artifacts.py bootstrap.py secure_desktop.py image_response_compat.py image_generation.py visual_explanation.py visual_deliberation.py vision_analysis.py interface_chat.py deliberation_tasks.py janus_dashboard.py
      - name: Verify policy constants and modes
        env:
          JANUS_DB_PATH: /tmp/janus-curiosity-test.sqlite3
          OPENAI_API_KEY: test-key-not-used
          JANUS_CURIOSITY_WEB: '1'
          JANUS_CURIOSITY_DAILY_SEARCH_CAP: '4'
          JANUS_CURIOSITY_RELEVANT_DAILY_CAP: '2'
          JANUS_CURIOSITY_ADJACENT_DAILY_CAP: '1'
          JANUS_CURIOSITY_WANDER_DAILY_CAP: '1'
          JANUS_CURIOSITY_MIN_GAP_SECONDS: '900'
        run: |
          python - <<'PY'
          import os, sqlite3
          import curiosity_search as c
          assert c.DAILY_CAP == 4
          assert c.RELEVANT_CAP == 2
          assert c.ADJACENT_CAP == 1
          assert c.WANDER_CAP == 1
          assert set(c.status().keys()) >= {'enabled','daily_web_cap','web_min_gap_seconds','model'}
          db=sqlite3.connect(os.environ['JANUS_DB_PATH'])
          db.execute('CREATE TABLE IF NOT EXISTS desktop_memory(id INTEGER PRIMARY KEY AUTOINCREMENT,profile_id TEXT,role TEXT,content TEXT,level TEXT,created_at TEXT)')
          db.execute('CREATE TABLE IF NOT EXISTS janus_deliberation_tasks(id INTEGER PRIMARY KEY AUTOINCREMENT,profile_id TEXT,topic TEXT,status TEXT,updated_at TEXT)')
          db.execute("INSERT INTO desktop_memory(profile_id,role,content,level,created_at) VALUES('tester','user','distributed memory and error correction','working','2026-08-21T00:00:00+00:00')")
          db.execute("INSERT INTO janus_deliberation_tasks(profile_id,topic,status,updated_at) VALUES('tester','compare two candidate naming schemes','active','2026-08-21T00:00:00+00:00')")
          db.commit(); db.close()
          choice=c._choose_search('tester')
          assert choice and choice[1]=='relevant', choice
          print('curiosity policy test passed:', choice[1])
          PY
      - name: Verify epistemic, proactive, usefulness, memory, continuity, research, reliability, persistence, security, sync, cost, maintenance, threads, artifacts and visual policy
        env:
          PYTHONPATH: ${{ github.workspace }}
          JANUS_DB_PATH: /tmp/janus-cognition-suite.sqlite3
          JANUS_FILE_DIR: /tmp/janus-cognition-files
          OPENAI_API_KEY: test-key-not-used
        run: python -m pytest -q tests/test_epistemic_regulation.py tests/test_proactive_quality.py tests/test_background_cognition.py tests/test_background_usefulness.py tests/test_memory_quality.py tests/test_continuity_ledger.py tests/test_continuity_governance.py tests/test_research_workspace.py tests/test_reliability_audit.py tests/test_persistence_matrix.py tests/test_profile_boundary_hardening.py tests/test_federated_sync.py tests/test_cost_governor.py tests/test_maintenance_review.py tests/test_proactive_threads.py tests/test_outbound_artifacts.py tests/test_visual_explanation.py tests/test_visual_deliberation.py
