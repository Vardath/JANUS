name: Build JANUS iOS Simulator

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify local 1-3-7 sensory society contract
        shell: bash
        run: |
          set -euxo pipefail
          LOCAL=ios/JANUS/LocalJanusSociety.swift
          API=ios/JANUS/APIClient.swift
          test -s "$LOCAL"
          grep -q 'specialists = \["evidence", "safety", "counterpoint", "context", "logic", "novelty", "memory"\]' "$LOCAL"
          grep -q 'coreNames = specialists + hemispheres + \["front", "interface"\]' "$LOCAL"
          grep -q '"evidence": 1' "$LOCAL"
          grep -q '"memory": 7' "$LOCAL"
          grep -q 'func ingestPeer' "$LOCAL"
          grep -q 'LocalJanusSociety.shared' "$API"
          grep -q 'front_appraisal: LocalAppraisal' "$API"
          grep -q 'core_summaries: \[String: String\]' "$API"
          grep -q 'localSociety.ingestPeer(server)' "$API"
          ! grep -q 'Interface.*Front.*recursive' "$LOCAL" || true

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned simulator app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project JANUS.xcodeproj \
            -scheme JANUS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            clean build | tee xcodebuild.log

      - name: Package simulator app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path '*Build/Products/Release-iphonesimulator/JANUS.app' -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "JANUS.app was not found"
            exit 1
          fi
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" artifacts/JANUS-iOS-simulator.zip

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: JANUS-iOS-simulator-v0.5
          path: artifacts/JANUS-iOS-simulator.zip
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JANUS-iOS-simulator-build-log
          path: ios/xcodebuild.log
          if-no-files-found: ignore
