name: Diagnose clean JANUS server v2

on:
  push:
    branches: [main]
    paths:
      - 'server_v2/**'
      - 'tools/verify_server_v2.py'
      - 'tools/verify_server_v2_session_cutover.py'
      - '.github/workflows/server-v2-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run diagnostics and record results
        shell: bash
        run: |
          set +e
          mkdir -p docs
          python -m py_compile server_v2/*.py tools/verify_server_v2.py tools/verify_server_v2_session_cutover.py > /tmp/compile.log 2>&1
          COMPILE=$?
          python tools/verify_server_v2.py > /tmp/verify.log 2>&1
          VERIFY=$?
          python tools/verify_server_v2_session_cutover.py > /tmp/session.log 2>&1
          SESSION=$?
          grep -R "^from \(bootstrap\|janus_dashboard\|dashboard_api\|interface_chat\|secure_desktop\|attachment_chat\|image_response_compat\|src\.janus_sleep_cycle\)" server_v2 > /tmp/legacy.log 2>&1
          LEGACY_FROM=$?
          grep -R "^import \(bootstrap\|janus_dashboard\|dashboard_api\|interface_chat\|secure_desktop\|attachment_chat\|image_response_compat\)" server_v2 >> /tmp/legacy.log 2>&1
          LEGACY_IMPORT=$?
          {
            echo "JANUS SERVER V2 DIAGNOSTIC"
            echo "verified_sha=${GITHUB_SHA}"
            echo "compile_exit=${COMPILE}"
            echo "verify_exit=${VERIFY}"
            echo "session_cutover_exit=${SESSION}"
            echo "legacy_from_grep_exit=${LEGACY_FROM}"
            echo "legacy_import_grep_exit=${LEGACY_IMPORT}"
            echo
            echo "--- compile log ---"
            tail -200 /tmp/compile.log
            echo
            echo "--- verifier log ---"
            tail -400 /tmp/verify.log
            echo
            echo "--- session cutover log ---"
            tail -200 /tmp/session.log
            echo
            echo "--- legacy import matches ---"
            cat /tmp/legacy.log
          } > docs/SERVER_V2_DIAGNOSTIC.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/SERVER_V2_DIAGNOSTIC.txt
          git commit -m "Record JANUS server v2 diagnostic result" || true
          git push || true
          if [ "$COMPILE" -ne 0 ] || [ "$VERIFY" -ne 0 ] || [ "$SESSION" -ne 0 ] || [ "$LEGACY_FROM" -eq 0 ] || [ "$LEGACY_IMPORT" -eq 0 ]; then
            exit 1
          fi
