name: Diagnose clean JANUS server v2

on:
  push:
    branches: [main]
    paths:
      - 'server_v2/**'
      - 'tools/verify_server_v2.py'
      - 'tools/verify_server_v2_session_cutover.py'
      - '.github/workflows/server-v2-diagnostic.yml'
  pull_request:
    paths:
      - 'server_v2/**'
      - 'tools/verify_server_v2.py'
      - 'tools/verify_server_v2_session_cutover.py'
      - '.github/workflows/server-v2-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile recursive server and verifiers
        run: python -m py_compile server_v2/*.py tools/verify_server_v2.py tools/verify_server_v2_session_cutover.py
      - name: Run clean server verification
        run: python tools/verify_server_v2.py
      - name: Run session cutover verification
        run: python tools/verify_server_v2_session_cutover.py
      - name: Prove no legacy application imports
        run: |
          ! grep -R "^from \(bootstrap\|janus_dashboard\|dashboard_api\|interface_chat\|secure_desktop\|attachment_chat\|image_response_compat\|src\.janus_sleep_cycle\)" server_v2
          ! grep -R "^import \(bootstrap\|janus_dashboard\|dashboard_api\|interface_chat\|secure_desktop\|attachment_chat\|image_response_compat\)" server_v2
      - name: Diagnostic summary
        run: |
          echo '## JANUS server v2 diagnostic' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Compile, clean-server verification, session cutover, and no-legacy-import checks passed.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This diagnostic intentionally does not commit generated status files back to main.' >> "$GITHUB_STEP_SUMMARY"
